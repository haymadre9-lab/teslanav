<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Tesla Nav</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{--txt:#e7eaf0;--dim:#9aa3b2;--bd:#26303f;--ok:#39d98a;--warn:#ff5d5d;}
  *{box-sizing:border-box;} html,body{margin:0;height:100%;background:#05070d;color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;overflow:hidden;}
  #app{position:fixed;inset:0;}
  #map{position:absolute;inset:0;}
  #hud{position:absolute;inset:0;display:none;background:#000;}
  #hud img{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:33%;}
  .scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 90% at 50% 55%,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%);}
  /* overlays comunes */
  .ovl{position:absolute;z-index:5;}
  .modes{top:10px;left:10px;display:flex;gap:6px;background:rgba(16,18,24,.7);border:1px solid var(--bd);border-radius:12px;padding:5px;backdrop-filter:blur(12px);}
  .modes button{border:0;background:transparent;color:var(--dim);font-weight:800;padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13px;}
  .modes button.on{background:var(--ok);color:#04130c;}
  .spd{top:10px;right:10px;display:flex;align-items:center;gap:10px;}
  .card{background:rgba(16,18,24,.72);border:1px solid var(--bd);border-radius:14px;padding:9px 13px;backdrop-filter:blur(12px);text-align:center;}
  .card .n{font-size:44px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;}
  .card .u{font-size:9px;letter-spacing:.12em;color:var(--dim);}
  .card .n.over{color:var(--warn);}
  .limit{width:74px;height:74px;border-radius:50%;background:#fff;border:9px solid #e01d1d;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5);}
  .limit span{font-size:28px;font-weight:800;color:#111;}
  .status{bottom:10px;left:10px;font-size:11px;color:var(--dim);background:rgba(16,18,24,.7);border:1px solid var(--bd);border-radius:9px;padding:6px 10px;}
  .recenter{bottom:10px;right:10px;background:rgba(16,18,24,.8);border:1px solid var(--bd);color:var(--txt);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;}
  /* señal de radar acercándose */
  .radarsign{position:absolute;left:0;top:0;z-index:6;display:none;flex-direction:column;align-items:center;transform-origin:bottom center;transition:transform .35s linear,left .35s linear,top .35s linear;pointer-events:none;}
  .radarsign.show{display:flex;}
  .rs-c{width:70px;height:70px;border-radius:50%;background:#fff;border:9px solid #e01d1d;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.65);}
  .rs-c span{font-size:28px;font-weight:800;color:#111;}
  .rs-p{width:6px;height:44px;background:linear-gradient(#9aa1ab,#5c636d);border-radius:3px;margin-top:-2px;}
  .rs-d{margin-top:3px;background:rgba(14,16,22,.85);border:1px solid var(--bd);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;color:#ffd54a;}
  .radarsign.hot .rs-c{animation:bl .5s infinite;} @keyframes bl{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.65);}50%{box-shadow:0 0 24px 9px rgba(255,45,45,.95);}}
  /* marcador del coche */
  #car3{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:26px solid var(--ok);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
  .maplibregl-ctrl-attrib{font-size:9px;}
  .daynight{bottom:10px;right:64px;background:rgba(16,18,24,.8);border:1px solid var(--bd);color:var(--txt);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;}
  .search{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(16,18,24,.8);border:1px solid var(--bd);border-radius:12px;padding:5px;backdrop-filter:blur(12px);}
  .search input{background:#0a0d13;border:1px solid var(--bd);border-radius:9px;color:var(--txt);padding:9px 12px;font-size:14px;width:46vw;max-width:360px;}
  .search button{border:0;background:var(--ok);color:#04130c;font-weight:800;border-radius:9px;padding:0 16px;cursor:pointer;}
  .navbanner{display:none;top:10px;left:50%;transform:translateX(-50%);align-items:center;gap:12px;background:rgba(16,18,24,.92);border:1px solid var(--bd);border-radius:16px;padding:8px 14px;backdrop-filter:blur(14px);}
  .navbanner .arrow{width:58px;height:62px;flex:0 0 auto;} .navbanner .arrow svg{width:100%;height:100%;display:block;}
  .navtext{display:flex;flex-direction:column;}
  .navd{font-size:30px;font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
  .navsub{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;margin-top:2px;}
  .navsmall{font-size:11px;color:var(--dim);margin-left:8px;padding-left:10px;border-left:1px solid var(--bd);text-align:right;line-height:1.35;}
  .navx{background:transparent;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:0 2px;}
  .navnext2{display:none;top:88px;left:50%;transform:translateX(-50%);align-items:center;gap:8px;background:rgba(16,18,24,.8);border:1px solid var(--bd);border-radius:12px;padding:5px 12px;backdrop-filter:blur(12px);}
  .navnext2 .arrow2{width:30px;height:32px;flex:0 0 auto;} .navnext2 .arrow2 svg{width:100%;height:100%;display:block;}
  .nn2txt{font-size:12px;color:var(--dim);}
</style></head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="hud"><img id="hudcar" alt=""><div class="scrim"></div></div>

  <div class="ovl modes">
    <button id="mMap" class="on">Mapa</button>
    <button id="mHud">HUD</button>
  </div>
  <div class="ovl spd">
    <div class="limit" id="limit" style="display:none"><span id="limitn">--</span></div>
    <div class="card"><div class="n" id="spd">0</div><div class="u">KM/H</div></div>
  </div>
  <div class="ovl status" id="status">Buscando GPS…</div>
  <div class="ovl search" id="searchBar">
    <input id="dest" type="text" placeholder="¿A dónde vamos?">
    <button id="goRoute">Ir</button>
  </div>
  <div class="ovl navbanner" id="navbanner">
    <div class="arrow" id="arrow"></div>
    <div class="navtext"><div class="navd" id="navdist">—</div><div class="navsub" id="navsub"></div></div>
    <div class="navsmall" id="navsmall"></div>
    <button class="navx" id="navx">✕</button>
  </div>
  <div class="ovl navnext2" id="navnext2"><div class="arrow2" id="arrow2"></div><div class="nn2txt" id="nn2txt"></div></div>
  <button class="ovl daynight" id="daynight">☀️</button>
  <button class="ovl recenter" id="recenter">🎯</button>

  <div class="radarsign" id="radarsign"><div class="rs-c"><span id="rsmax">80</span></div><div class="rs-p"></div><div class="rs-d" id="rsdist">500 m</div></div>
</div>

function dist(a,b){const R=6371000,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180,
  la1=a[0]*Math.PI/180,la2=b[0]*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){const y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180),
  x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1).replace('.',',')+' km':Math.round(m/10)*10+' m';}
function moveLL(lat,lon,head,dm){ // avanza dm metros desde lat/lon con rumbo head
  const R=6371000,d=dm/R,h=head*Math.PI/180,la=lat*Math.PI/180,lo=lon*Math.PI/180;
  const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(h));
  const lo2=lo+Math.atan2(Math.sin(h)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return [la2*180/Math.PI,lo2*180/Math.PI];
}
function angLerp(a,b,t){let d=((b-a+540)%360)-180;return (a+d*t+360)%360;}

function locate(){ if(navigator.geolocation) navigator.geolocation.getCurrentPosition(()=>{}, e=>{$('status').textContent='GPS: '+e.message;}, {enableHighAccuracy:true,timeout:20000}); }
navigator.geolocation && navigator.geolocation.watchPosition(p=>{
  const c=p.coords, now=p.timestamp;
  let v=c.speed; if(v==null||isNaN(v)){ if(raw){const dt=(now-raw.t)/1000; v=dt>0?dist([raw.lat,raw.lon],[c.latitude,c.longitude])/dt:0;} else v=0; }
  let head=c.heading; if(head==null||isNaN(head)){ if(raw && v>1) head=bearing([raw.lat,raw.lon],[c.latitude,c.longitude]); else head=raw?raw.head:0; }
  speedKmh=Math.max(0,v*3.6);
  raw={lat:c.latitude,lon:c.longitude,head:head||0,spd:v||0,t:now};
  if(!disp) disp={lat:raw.lat,lon:raw.lon,head:raw.head};
  const acc=Math.round(c.accuracy||0);
  $('status').textContent='GPS '+c.latitude.toFixed(4)+', '+c.longitude.toFixed(4)+' · ±'+acc+' m'+(acc>800?' (impreciso: WiFi/IP, no GPS real)':' ✔');
  const here=[raw.lat,raw.lon];
  if(!lastPoiPos||dist(lastPoiPos,here)>800||now-lastPoiAt>60000){lastPoiAt=now;lastPoiPos=here;fetchPois(here);}
  if(!lastLimPos||dist(lastLimPos,here)>60||now-lastLimAt>8000){lastLimAt=now;lastLimPos=here;fetchLimit(here);}
},e=>{$('status').textContent='GPS: '+e.message;},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});

let last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(disp && raw){
    // 1) avanza por estima (dead-reckoning) según velocidad y rumbo
    if(raw.spd>0.5){ const step=raw.spd*dt; const nx=moveLL(disp.lat,disp.lon,disp.head,step); disp.lat=nx[0]; disp.lon=nx[1]; }
    // 2) corrige suavemente hacia la lectura real (evita deriva)
    disp.lat += (raw.lat-disp.lat)*Math.min(1,dt*1.8);
    disp.lon += (raw.lon-disp.lon)*Math.min(1,dt*1.8);
    disp.head = angLerp(disp.head, raw.head, Math.min(1,dt*3));
    carMk.setLngLat([disp.lon,disp.lat]); carMk.setRotation(disp.head);
    if(follow){ const ah=moveLL(disp.lat,disp.lon,disp.head,55); map.jumpTo({center:[ah[1],ah[0]], bearing:disp.head}); }
  }
  $('spd').textContent=Math.round(speedKmh);
  if(limit){ $('limit').style.display='flex'; $('limitn').textContent=limit; $('spd').classList.toggle('over',speedKmh>limit+3); }
  else $('limit').style.display='none';
  updateRadar();
  if(routeOn) trackRoute();
  requestAnimationFrame(frame);
}

const rot={'straight':0,'slight right':40,'right':90,'sharp right':135,'uturn':180,'sharp left':-135,'left':-90,'slight left':-40};
function arrowSVG(mod){return '<svg viewBox="0 0 48 52"><path d="M24 8 L24 44 M24 8 L13 20 M24 8 L35 20" fill="none" stroke="#fff" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" transform="rotate('+(rot[mod]||0)+' 24 26)"/></svg>';}
function arrowHead(x,y,t,c){const a1=t+2.55,a2=t-2.55,l=6.5;return '<path d="M'+x.toFixed(1)+' '+y.toFixed(1)+' L'+(x+Math.sin(a1)*l).toFixed(1)+' '+(y-Math.cos(a1)*l).toFixed(1)+' M'+x.toFixed(1)+' '+y.toFixed(1)+' L'+(x+Math.sin(a2)*l).toFixed(1)+' '+(y-Math.cos(a2)*l).toFixed(1)+'" stroke="'+c+'" stroke-width="4" stroke-linecap="round"/>';}
function roundaboutSVG(exit,mod){
  const c='#fff',g='#5b6472',cx=24,cy=26,r=9;
  const n=parseInt(exit,10);
  const deg = n===1?90 : n===2?0 : n===3?-90 : 180;   // 1 dcha · 2 frente · 3 izq · 4+ abajo
  const t=deg*Math.PI/180;
  const ex=cx+Math.sin(t)*r, ey=cy-Math.cos(t)*r, ox=cx+Math.sin(t)*(r+13), oy=cy-Math.cos(t)*(r+13);
  return '<svg viewBox="0 0 48 52">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+g+'" stroke-width="3.6"/>'
    +'<path d="M'+cx+' 50 L'+cx+' '+(cy+r)+'" stroke="'+g+'" stroke-width="4.2" stroke-linecap="round"/>'
    +'<path d="M'+ex.toFixed(1)+' '+ey.toFixed(1)+' L'+ox.toFixed(1)+' '+oy.toFixed(1)+'" stroke="'+c+'" stroke-width="4.6" stroke-linecap="round"/>'
    +arrowHead(ox,oy,t,c)
    +(exit?'<circle cx="39" cy="12" r="9.5" fill="#39d98a"/><text x="39" y="16.5" text-anchor="middle" font-size="13" font-weight="800" fill="#04130c">'+exit+'</text>':'')
    +'</svg>';
}
function maneuverSVG(st){ const m=st.maneuver||{}; if(m.type==='roundabout'||m.type==='rotary') return roundaboutSVG(m.exit,m.modifier); return arrowSVG(m.modifier); }
function shortHint(st){ const m=st.maneuver||{},t=m.type,mod=m.modifier;
  if(t==='roundabout'||t==='rotary')return 'Rotonda'+(m.exit?' · salida '+m.exit:'');
  if(t==='off ramp')return 'Salida'; if(t==='on ramp'||t==='merge')return 'Incorpórate'; if(t==='arrive')return 'Destino'; if(t==='depart')return 'Inicio';
  const mm={'left':'Izquierda','right':'Derecha','slight left':'Izq. suave','slight right':'Dcha. suave','sharp left':'Izq. cerrada','sharp right':'Dcha. cerrada','straight':'Recto','uturn':'Cambio de sentido'};
  return mm[mod]||'Sigue'; }
function instrES(s){
  const m=s.maneuver||{}, mod=m.modifier, type=m.type, name=s.name||'';
  const dir={'left':'gira a la izquierda','right':'gira a la derecha','slight left':'ligeramente a la izquierda','slight right':'ligeramente a la derecha','sharp left':'giro cerrado a la izquierda','sharp right':'giro cerrado a la derecha','straight':'sigue recto','uturn':'haz el cambio de sentido'};
  if(type==='depart') return 'Comienza la ruta'+(name?' por '+name:'');
  if(type==='arrive') return 'Has llegado a tu destino';
  if(type==='roundabout'||type==='rotary') return 'En la rotonda, toma la salida '+(m.exit||'');
  if(type==='merge') return 'Incorpórate'+(name?' a '+name:'');
  if(type==='on ramp') return 'Toma la incorporación'+(name?' a '+name:'');
  if(type==='off ramp') return 'Toma la salida'+(name?' hacia '+name:'');
  if(type==='fork') return (mod&&mod.indexOf('left')>=0)?'En la bifurcación, mantente a la izquierda':'En la bifurcación, mantente a la derecha';
  const d=dir[mod]||'continúa'; return d.charAt(0).toUpperCase()+d.slice(1)+(name?' por '+name:'');
}
function segDistM(p,a,b){const mx=111320*Math.cos(p[0]*Math.PI/180),my=110540;const px=p[1]*mx,py=p[0]*my,ax=a.lon*mx,ay=a.lat*my,bx=b.lon*mx,by=b.lat*my;const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
function distToRoute(here){let best=1e9;for(let i=1;i<routeGeom.length;i++){const dd=segDistM(here,{lat:routeGeom[i-1][0],lon:routeGeom[i-1][1]},{lat:routeGeom[i][0],lon:routeGeom[i][1]});if(dd<best)best=dd;}return best;}
function ensureRouteLayer(){ if(map.getSource('route'))return; try{

$('daynight').textContent='🌙';
let routeCoords=[], routeProgIdx=0;
function drawRoute(coords){ ensureRouteLayer(); routeCoords=coords; routeProgIdx=0; const src=map.getSource('route'); if(src) src.setData({type:'Feature',geometry:{type:'LineString',coordinates:coords}}); routeGeom=coords.map(c=>[c[1],c[0]]); }
function trimRoute(){
  if(!routeCoords.length||!disp)return;
  let bi=routeProgIdx,bd=1e9; const end=Math.min(routeCoords.length,routeProgIdx+80);
  for(let i=routeProgIdx;i<end;i++){ const dd=dist([disp.lat,disp.lon],[routeCoords[i][1],routeCoords[i][0]]); if(dd<bd){bd=dd;bi=i;} }
  if(bi!==routeProgIdx){ routeProgIdx=bi; const ahead=[[disp.lon,disp.lat]].concat(routeCoords.slice(routeProgIdx)); const src=map.getSource('route'); if(src) src.setData({type:'Feature',geometry:{type:'LineString',coordinates:ahead}}); }
}
async function geocode(q){ try{ const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1&countrycodes=es&accept-language=es'); const j=await r.json(); if(j&&j.length) return [parseFloat(j[0].lat),parseFloat(j[0].lon)]; }catch(e){} return null; }
async function routeTo(dest){
  if(!raw){ $('status').textContent='Sin GPS todavía'; return; }
  const o=[raw.lat,raw.lon];
  try{
    const url='https://router.project-osrm.org/route/v1/driving/'+o[1]+','+o[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson&steps=true';
    const r=await fetch(url); const j=await r.json();
    if(!j.routes||!j.routes.length){ $('status').textContent='Sin ruta'; return; }
    const rt=j.routes[0]; drawRoute(rt.geometry.coordinates);
    steps=rt.legs.flatMap(l=>l.steps).map(s=>({distance:s.distance,name:s.name,maneuver:s.maneuver,ll:[s.maneuver.location[1],s.maneuver.location[0]],instr:instrES(s),_min:1e9,_v:false}));
    stepIdx=0; destLL=dest; routeOn=true; offAcc=0;
    $('searchBar').style.display='none'; $('navbanner').style.display='flex';
    renderStep(true);
  }catch(e){ $('status').textContent='Error de ruta'; }
}
function renderStep(say){ const s=steps[stepIdx]; if(!s)return; $('arrow').innerHTML=maneuverSVG(s); $('navsub').textContent=s.name||shortHint(s); if(say) speak(s.instr);
  const nx=steps[stepIdx+1];
  if(nx){ $('navnext2').style.display='flex'; $('arrow2').innerHTML=maneuverSVG(nx); $('nn2txt').textContent='Luego · '+shortHint(nx); } else $('navnext2').style.display='none';
}
function endRoute(){ routeOn=false; steps=[]; const src=map.getSource('route'); if(src) src.setData({type:'Feature',geometry:{type:'LineString',coordinates:[]}}); $('navbanner').style.display='none'; $('navnext2').style.display='none'; $('searchBar').style.display='flex'; }
function trackRoute(){
  if(!routeOn||!disp||!steps.length)return;
  trimRoute();
  const here=[disp.lat,disp.lon];
  const dr=distToRoute(here);
  if(dr>70) offAcc++; else offAcc=0;
  if(offAcc>25 && performance.now()-lastRecalc>8000){ lastRecalc=performance.now(); offAcc=0; speak('Recalculando ruta'); routeTo(destLL); return; }
  let s=steps[stepIdx]; let d=dist(here,s.ll); s._min=Math.min(s._min,d);
  if(!s._v && d<320 && d>70){ s._v=true; speak('En '+fmtDist(d)+', '+s.instr); }
  const thr=Math.max(20,(raw.spd||0)*1.4);
  const passed = s._min<55 && d>s._min+15;
  if((d<thr||passed) && stepIdx<steps.length-1){ stepIdx++; renderStep(true); s=steps[stepIdx]; d=dist(here,s.ll); }
  $('navdist').textContent='En '+fmtDist(d);
  let rem=0; for(let i=stepIdx;i<steps.length;i++) rem+=steps[i].distance;
  const mins=Math.max(1,Math.round(rem/(Math.max(8,speedKmh)/3.6)/60));
  const eta=new Date(Date.now()+mins*60000);
  $('navsmall').textContent=fmtDist(rem)+' · '+(mins>=60?Math.floor(mins/60)+' h '+(mins%60)+' min':mins+' min')+' · '+eta.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  if(stepIdx===steps.length-1 && dist(here,destLL)<40){ speak('Has llegado a tu destino'); endRoute(); }
}
$('goRoute').onclick=async ()=>{ const q=$('dest').value.trim(); if(!q)return; $('goRoute').textContent='…'; const d=await geocode(q); $('goRoute').textContent='Ir'; if(!d){ $('status').textContent='Destino no encontrado'; return; } routeTo(d); };
$('dest').addEventListener('keydown',e=>{ if(e.key==='Enter') $('goRoute').click(); });
$('navx').onclick=endRoute;

map.on('dragstart',()=>{follow=false;});
$('recenter').onclick=()=>{ follow=true; locate(); if(disp) map.easeTo({center:[disp.lon,disp.lat],bearing:disp.head,zoom:15.6,pitch:55}); };

// ---------- POIs (Overpass): radares + cargadores ----------
function parseMax(v){ if(!v) return null; const m=(''+v).match(/\d+/); return m?parseInt(m[0]):null; }
async function fetchPois(ll){
  const R=6000;
  const q=`[out:json][timeout:25];(node(around:${R},${ll[0]},${ll[1]})[highway=speed_camera];node(around:${R},${ll[0]},${ll[1]})[enforcement=maxspeed];node(around:${R},${ll[0]},${ll[1]})[amenity=charging_station];);out tags center;`;
  let j=null;
  for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
    try{const r=await fetch(ep,{method:'POST',body:q});if(r.ok){j=await r.json();if(j)break;}}catch(e){}
  }
  if(!j) return;
  const arr=[];
  for(const e of (j.elements||[])){
    const lat=e.lat||(e.center&&e.center.lat),lon=e.lon||(e.center&&e.center.lon); if(lat==null)continue;
    const tg=e.tags||{};
    if(tg.highway==='speed_camera'||tg.enforcement==='maxspeed') arr.push({type:'radar',ll:[lat,lon],max:parseMax(tg.maxspeed),_al:false});
    else if(tg.amenity==='charging_station') arr.push({type:'charge',ll:[lat,lon]});
  }
  pois=arr; drawPois();
}
let poiMarkers=[];
function drawPois(){
  poiMarkers.forEach(m=>m.remove()); poiMarkers=[];
  for(const p of pois){
    const el=document.createElement('div');
    if(p.type==='charge'){ el.style.cssText='width:14px;height:14px;border-radius:50%;background:#39d98a;border:2px solid #04130c;'; }
    else { el.style.cssText='width:16px;height:16px;border-radius:50%;background:#e01d1d;border:2px solid #fff;'; }
    poiMarkers.push(new maplibregl.Marker({element:el}).setLngLat([p.ll[1],p.ll[0]]).addTo(map));
  }
}

// ---------- límite (estimado por tipo de vía si no hay oficial) ----------
const HWDEF={motorway:120,motorway_link:80,trunk:120,trunk_link:80,primary:90,secondary:90,tertiary:70,unclassified:50,residential:30,living_street:20,service:20,road:50};
async function fetchLimit(ll){
  const q=`[out:json][timeout:12];way(around:45,${ll[0]},${ll[1]})[highway];out tags geom 60;`;
  for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
    try{
      const r=await fetch(ep,{method:'POST',body:q}); if(!r.ok) continue;
      const j=await r.json();
      let best=null,bd=1e9;
      for(const el of (j.elements||[])){
        const hw=el.tags&&el.tags.highway; if(!hw||!(hw in HWDEF)||!el.geometry) continue;
        let d=1e9; for(let i=1;i<el.geometry.length;i++){ const dd=segDistM(ll,{lat:el.geometry[i-1].lat,lon:el.geometry[i-1].lon},{lat:el.geometry[i].lat,lon:el.geometry[i].lon}); if(dd<d)d=dd; }
        if(d<bd){ bd=d; best=el; }
      }
      if(best){ limit=parseMax(best.tags.maxspeed)||HWDEF[best.tags.highway]||null; return; }
      return;
    }catch(e){}
  }
}

// ---------- voz + señal de radar acercándose ----------
let voz=null; if('speechSynthesis'in window){const pv=()=>{const vs=speechSynthesis.getVoices();voz=vs.find(v=>/es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;};pv();speechSynthesis.onvoiceschanged=pv;}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';if(voz)u.voice=voz;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function updateRadar(){
  if(!disp){return;}
  let best=null;
  for(const p of pois){
    if(p.type!=='radar')continue;
    p.dist=dist([disp.lat,disp.lon],p.ll);
    const ah=Math.abs(((bearing([disp.lat,disp.lon],p.ll)-disp.head+540)%360)-180)<95;
    if(!ah)continue;
    if(p.dist<800&&(!best||p.dist<best.dist))best=p;
    if(p.dist<520&&!p._al){p._al=true;speak('A '+fmtDist(p.dist)+', radar'+(p.max?' a '+p.max:''));}
    if(p.dist>700)p._al=false;
  }
  const el=$('radarsign');
  if(!best){el.classList.remove('show','hot');return;}
  const pp=1-Math.min(1,best.dist/800);
  el.style.left=(70+pp*16)+'%'; el.style.top=(58+pp*36)+'%';
  el.style.transform='translate(-50%,-100%) scale('+(0.5+pp*0.85).toFixed(3)+')';
  $('rsmax').textContent=best.max||'⚠'; $('rsdist').textContent=fmtDist(Math.max(0,best.dist));
  el.classList.add('show'); el.classList.toggle('hot',best.dist<520);
}

// ---------- cambio de modo ----------
$('mMap').onclick=()=>{$('hud').style.display='none';$('map').style.display='block';$('mMap').classList.add('on');$('mHud').classList.remove('on');map.resize();};
$('mHud').onclick=()=>{$('map').style.display='none';$('hud').style.display='block';$('mHud').classList.add('on');$('mMap').classList.remove('on');};
