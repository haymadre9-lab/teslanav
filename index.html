<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Nav — Simulador 3D</title>
<style>
  :root{
    --bg:#05070d; --txt:#e7eaf0; --dim:#9aa3b2; --bd:#26303f;
    --ok:#39d98a; --warn:#f5b942; --bad:#ef5350; --accent:#39d98a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;}
  #stage{position:absolute;inset:0;
    background:linear-gradient(#0a1526 0%,#0e2038 30%,#0b1322 46%,#070b13 100%);}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #rain{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;z-index:6;pointer-events:none;}

  /* Velocímetro SVG estilo Tesla */
  .speedo{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    width:230px;height:150px;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.55));
  }
  .speedo svg{width:100%;height:100%;display:block;}
  .speedo .track{fill:none;stroke:#1b2130;stroke-width:10;stroke-linecap:round;}
  .speedo .prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;
    transition:stroke .25s ease;}
  .speedo .num{font-size:44px;font-weight:800;fill:#fff;letter-spacing:-1px;}
  .speedo .unit{font-size:11px;font-weight:700;fill:var(--dim);letter-spacing:2px;}

  /* Curvatura */
  .curv{
    position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
    width:180px;height:6px;border-radius:3px;background:#1b2130;overflow:hidden;
  }
  .curv::after{
    content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#2b3648;
    transform:translateX(-1px);
  }
  .curv .fill{
    position:absolute;top:0;bottom:0;left:50%;width:0;
    background:linear-gradient(90deg,var(--accent),var(--warn));
    transition:width .1s linear,left .1s linear;
  }

  /* Estado arriba dcha */
  .status{
    position:absolute;top:14px;right:14px;display:flex;gap:8px;align-items:center;
  }
  .chip{
    background:rgba(16,18,24,.72);border:1px solid var(--bd);
    border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;
    color:var(--dim);display:flex;gap:6px;align-items:center;
    backdrop-filter:blur(6px);
  }
  .chip.on{color:#04130c;background:var(--ok);border-color:var(--ok);}
  .chip.warn{color:#1a1200;background:var(--warn);border-color:var(--warn);}

  /* Info abajo izq */
  .info{
    position:absolute;left:12px;bottom:12px;
    background:rgba(16,18,24,.72);border:1px solid var(--bd);
    border-radius:10px;padding:6px 10px;font-size:11px;color:var(--dim);
    line-height:1.5;backdrop-filter:blur(6px);
  }
  .info b{color:var(--txt);font-weight:800;}

  /* Panel control */
  #panel{
    position:absolute;left:50%;top:8px;transform:translateX(-50%);
    width:min(96vw,820px);
    background:rgba(14,16,22,.84);border:1px solid var(--bd);
    border-radius:14px;padding:8px 11px;z-index:30;
    backdrop-filter:blur(8px);
    transition:opacity .25s ease,transform .25s ease;
  }
  #panel.hidden{opacity:0;transform:translate(-50%,-130%);pointer-events:none;}
  #panel .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  #panel .row+.row{margin-top:7px;}
  #panel label{font-size:12px;color:var(--dim);min-width:62px;}
  #panel input[type=range]{flex:1;min-width:120px;accent-color:var(--ok);}
  #panel button{
    border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;
    cursor:pointer;background:#1b2130;color:var(--txt);transition:.15s;
  }
  #panel button:hover{background:#242c3d;}
  #panel button.g{background:var(--ok);color:#04130c;}
  #panel button.on{outline:2px solid var(--ok);}
  #panel input[type=color]{
    width:34px;height:30px;border:0;border-radius:8px;background:none;padding:0;cursor:pointer;
  }
  .val{min-width:62px;text-align:right;font-weight:800;font-size:12px;}

  #msg{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:8;background:rgba(16,18,24,.92);border:1px solid var(--bd);
    border-radius:12px;padding:14px 18px;font-size:14px;
    display:flex;gap:10px;align-items:center;
  }
  #msg .dot{
    width:10px;height:10px;border-radius:50%;background:var(--accent);
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="rain"></canvas>

  <div id="hud">
    <div class="status">
      <div class="chip" id="chipBrake">🛑 FRENO</div>
      <div class="chip" id="chipRain">🌧️ SECO</div>
      <div class="chip on" id="chipDay">☀️ DÍA</div>
    </div>

    <div class="speedo">
      <svg viewBox="0 0 230 150" preserveAspectRatio="xMidYMid meet">
        <path class="track" id="arcTrack" d="M25,125 A90,90 0 0 1 205,125"/>
        <path class="prog"  id="arcProg"  d="M25,125 A90,90 0 0 1 205,125"/>
        <text class="num" id="spdNum" x="115" y="105" text-anchor="middle">0</text>
        <text class="unit" id="spdUnit" x="115" y="128" text-anchor="middle">KM/H</text>
      </svg>
    </div>
    <div class="curv"><div class="fill" id="curvFill"></div></div>

    <div class="info">
      <div>Vista: <b id="infoView">Perseguidor</b></div>
      <div>Curvatura: <b id="infoCurv">0</b> · Heading: <b id="infoHdg">0°</b></div>
      <div>FPS: <b id="infoFps">–</b> · Pulsa <b>H</b> para ocultar panel</div>
    </div>
  </div>

  <div id="panel">
    <div class="row">
      <label>Velocidad</label>
      <input id="spdS" type="range" min="0" max="200" value="80">
      <span class="val" id="spdV">80 km/h</span>
    </div>
    <div class="row">
      <label>Volante</label>
      <input id="steerS" type="range" min="-100" max="100" value="0">
      <span class="val" id="steerV">centro</span>
    </div>
    <div class="row">
      <button id="bL">↰ Izq</button>
      <button id="bS">↑ Recto</button>
      <button id="bR">↱ Dcha</button>
      <button id="bBrake">🛑 Freno</button>
      <button id="bRain">🌧️ Lluvia</button>
      <button id="bDay" class="on">☀️ Día</button>
      <button id="bNight">🌙 Noche</button>
      <button id="bCam">🎥 Vista</button>
    </div>
    <div class="row">
      <button id="bDemo" class="g">▶ Demo</button>
      <label style="min-width:auto">Color</label>
      <input id="col" type="color" value="#7d838c">
      <span class="val" id="colV" style="min-width:80px">#7d838c</span>
    </div>
  </div>

  <div id="msg"><span class="dot"></span><span id="msgTxt">Cargando car.glb…</span></div>
</div>

<!-- ============================== THREE.JS r128 ============================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- ============================== APP ============================== -->
<script>
(function(){
'use strict';

/* ============================================================
   0. ESTADO GLOBAL (esto lo lee Autoboard)
   ============================================================ */
window.TESLA_STATE = {
  speed: 0,           // km/h
  speedMs: 0,
  curvature: 0,       // -100..100
  heading: 0,         // grados
  lat: 40.4168,
  lon: -3.7038,
  steering: 0,        // -1..1
  braking: false,
  raining: false,
  dayNight: 1,        // 0=noche 1=día
  view: 'chase',
  wheelsDetected: false,
  loaded: false,
  timestamp: 0
};

/* ============================================================
   1. UTILIDADES
   ============================================================ */
const $  = (id) => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const wrapPi = (a) => { while(a> Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };

/* ============================================================
   2. ESCENA / RENDER / CÁMARA
   ============================================================ */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1526, 60, 320);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 6, -12);

/* ============================================================
   3. LUCES (día / noche)
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbcd6ff, 0x0a1020, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe9c4, 1.15);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -60;
sun.shadow.camera.right  =  60;
sun.shadow.camera.top    =  60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.near   =   1;
sun.shadow.camera.far    = 200;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ambient = new THREE.AmbientLight(0x223046, 0.4);
scene.add(ambient);

let isDay = true;
let dayNightT = 1; // 1 = día, 0 = noche

function applyDayNight(){
  const t = dayNightT;
  sun.intensity     = lerp(0.05, 1.15, t);
  hemi.intensity    = lerp(0.12, 0.85, t);
  ambient.intensity = lerp(0.25, 0.40, t);
  hemi.color.setHSL(0.58, 0.5, lerp(0.08, 0.75, t));
  sun.color.setHSL(0.10, 0.55, lerp(0.55, 0.75, t));
  scene.fog.color.setHSL(0.58, 0.5, lerp(0.02, 0.08, t));
  renderer.toneMappingExposure = lerp(0.65, 1.05, t);
}

/* ============================================================
   4. CARRETERA CON SPLINE
   ============================================================ */
const ROAD_HALF_WIDTH = 4.5;   // 9 m de ancho total
const MAX_LATERAL = ROAD_HALF_WIDTH - 0.9; // margen para no salir

// Genera una spline cerrada con tramos variados
function buildRoadSpline(){
  const pts = [];
  const N = 28;
  const radius = 90;
  for(let i=0;i<N;i++){
    const a = i/N * Math.PI*2;
    // modulación radial para que no sea un círculo perfecto
    const r = radius
      + 22*Math.sin(a*2.0)
      + 14*Math.sin(a*3.0 + 1.1)
      +  9*Math.sin(a*5.0 + 2.3);
    pts.push(new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  return curve;
}

const roadCurve = buildRoadSpline();
const roadLength = roadCurve.getLength();

// Geometría de la cinta
function buildRoadMesh(curve, halfWidth){
  const divisions = 800;
  const positions = [];
  const uvs = [];
  const indices = [];
  const tmp = new THREE.Vector3();
  const tan = new THREE.Vector3();
  const up  = new THREE.Vector3(0,1,0);
  const nor = new THREE.Vector3();
  const bin = new THREE.Vector3();

  for(let i=0;i<=divisions;i++){
    const t = i/divisions;
    curve.getPointAt(t, tmp);
    curve.getTangentAt(t, tan);
    nor.crossVectors(up, tan).normalize();
    // cinta
    positions.push(tmp.x - nor.x*halfWidth, 0.02, tmp.z - nor.z*halfWidth);
    positions.push(tmp.x + nor.x*halfWidth, 0.02, tmp.z + nor.z*halfWidth);
    uvs.push(0, t*40, 1, t*40);
    if(i<divisions){
      const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
      indices.push(a,b,c,  b,d,c);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(indices);
  g.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x1b2028, roughness: 0.95, metalness: 0.0
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.receiveShadow = true;
  return mesh;
}

const roadMesh = buildRoadMesh(roadCurve, ROAD_HALF_WIDTH);
scene.add(roadMesh);

// Líneas laterales
function buildEdgeLines(curve, halfWidth, offset, color){
  const divisions = 800;
  const positions = [];
  const tmp = new THREE.Vector3();
  const tan = new THREE.Vector3();
  const up  = new THREE.Vector3(0,1,0);
  const nor = new THREE.Vector3();
  for(let i=0;i<=divisions;i++){
    const t = i/divisions;
    curve.getPointAt(t, tmp);
    curve.getTangentAt(t, tan);
    nor.crossVectors(up, tan).normalize();
    const side = offset>0?1:-1;
    positions.push(tmp.x + nor.x*offset, 0.04, tmp.z + nor.z*offset);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  const m = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.55 });
  return new THREE.Line(g, m);
}

scene.add(buildEdgeLines(roadCurve, ROAD_HALF_WIDTH,  ROAD_HALF_WIDTH-0.25, 0xffffff));
scene.add(buildEdgeLines(roadCurve, ROAD_HALF_WIDTH, -ROAD_HALF_WIDTH+0.25, 0xffffff));

// Línea central discontinua
(function(){
  const divisions = 400;
  const positions = [];
  const tmp = new THREE.Vector3();
  for(let i=0;i<divisions;i+=2){
    const t0 = i/divisions, t1 = (i+1)/divisions;
    curveDash(t0, tmp); positions.push(tmp.x, 0.05, tmp.z);
    curveDash(t1, tmp); positions.push(tmp.x, 0.05, tmp.z);
  }
  function curveDash(t, out){
    roadCurve.getPointAt(t, out);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  const m = new THREE.LineBasicMaterial({ color: 0xf5e8b0, transparent:true, opacity:0.7 });
  scene.add(new THREE.LineSegments(g, m));
})();

/* ============================================================
   5. SUELO / ENTORNO
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1200, 1200),
  new THREE.MeshStandardMaterial({ color: 0x0a1424, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// Grid tenue para dar sensación de movimiento
const grid = new THREE.GridHelper(600, 60, 0x1b2c44, 0x122032);
grid.position.y = 0.005;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// Postes de luz (referencias visuales para que se note el avance)
(function(){
  const postMat = new THREE.MeshStandardMaterial({ color:0x243040, roughness:0.6, metalness:0.4 });
  const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0 });
  const N = 60;
  for(let i=0;i<N;i++){
    const t = i/N;
    const p = roadCurve.getPointAt(t);
    const tan = roadCurve.getTangentAt(t);
    const nor = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), tan).normalize();
    const baseX = p.x + nor.x*(ROAD_HALF_WIDTH+1.2);
    const baseZ = p.z + nor.z*(ROAD_HALF_WIDTH+1.2);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,5,6), postMat);
    post.position.set(baseX, 2.5, baseZ);
    post.castShadow = true;
    scene.add(post);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8), bulbMat);
    bulb.position.set(baseX, 5, baseZ);
    scene.add(bulb);
  }
})();

/* ============================================================
   6. COCHE (GLB)
   ============================================================ */
const carGroup = new THREE.Group();          // wrapper absoluto (posición + heading real)
const carBody  = new THREE.Group();          // wrapper relativo (giro fino del morro)
carGroup.add(carBody);
scene.add(carGroup);

// Sombras falsas bajo el coche
const shadowBlob = new THREE.Mesh(
  new THREE.PlaneGeometry(5.2, 2.6),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.35, depthWrite:false })
);
shadowBlob.rotation.x = -Math.PI/2;
shadowBlob.position.y = 0.03;
carGroup.add(shadowBlob);

let carModel = null;
let wheels = { fl:null, fr:null, rl:null, rr:null };
let bodyMaterial = null;
let carLength = 4.6;

const WHEEL_RE = /(wheel|tire|tyre|rueda|llanta|neumatic|pneu|roue|rad)/i;

function setupCar(gltf){
  carModel = gltf.scene;

  // Auto-escala a ~4.6 m de largo
  const box = new THREE.Box3().setFromObject(carModel);
  const size = new THREE.Vector3(); box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 4.6 / maxDim;
  carModel.scale.setScalar(scale);

  // Re-centrar en el suelo
  const box2 = new THREE.Box3().setFromObject(carModel);
  const center = new THREE.Vector3(); box2.getCenter(center);
  carModel.position.x -= center.x;
  carModel.position.z -= center.z;
  carModel.position.y -= box2.min.y;

  // Sombras + materiales
  carModel.traverse(o=>{
    if(o.isMesh){
      o.castShadow = true;
      o.receiveShadow = false;
      if(o.material){
        const mats = Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>{
          if(m.name && /body|paint|carroceria/i.test(m.name)){
            bodyMaterial = m;
          }
        });
      }
    }
  });

  // Detección de ruedas por nombre
  carModel.traverse(o=>{
    if(!o.name) return;
    if(WHEEL_RE.test(o.name)){
      // heurística: delanteras vs traseras por Z local
      const wp = new THREE.Vector3();
      o.getWorldPosition(wp);
      const local = carModel.worldToLocal(wp.clone());
      const isFront = local.z > 0;
      const isLeft  = local.x > 0;
      if(isFront && isLeft)  wheels.fl = o;
      if(isFront && !isLeft) wheels.fr = o;
      if(!isFront && isLeft) wheels.rl = o;
      if(!isFront && !isLeft)wheels.rr = o;
    }
  });
  window.TESLA_STATE.wheelsDetected = !!(wheels.fl||wheels.fr||wheels.rl||wheels.rr);

  // Guardar posición base de las ruedas para rotarlas
  Object.values(wheels).forEach(w=>{ if(w) w.userData.baseRotY = w.rotation.y; });

  carBody.add(carModel);
  window.TESLA_STATE.loaded = true;
  $('msg').style.display = 'none';
}

/* ============================================================
   7. CARGA DEL GLB
   ============================================================ */
const loader = new THREE.GLTFLoader();
loader.load('./car.glb',
  (gltf)=>{ try{ setupCar(gltf); }catch(e){ console.error(e); $('msgTxt').textContent = 'Error al preparar el coche'; } },
  (ev)=>{ if(ev.total){ $('msgTxt').textContent = 'Cargando car.glb… ' + Math.round(ev.loaded/ev.total*100) + '%'; } },
  (err)=>{ console.error(err); $('msgTxt').textContent = 'No se encontró car.glb (colócalo junto al index.html)'; }
);

/* ============================================================
   8. MOTOR DE CONDUCCIÓN
   ============================================================ */
const drive = {
  t: 0,               // posición 0..1 sobre la spline (da vueltas)
  lateral: 0,         // -MAX_LATERAL..MAX_LATERAL
  speed: 80/3.6,      // m/s
  targetSpeed: 80/3.6,
  steer: 0,           // -1..1 (input)
  steerSmooth: 0,     // suavizado para la cámara/ruedas
  braking: false,
  heading: 0,
  curvature: 0,       // -100..100
  pitch: 0,
  roll: 0
};

let demoOn = false;
let demoTimer = 0;

function updateDrive(dt){
  // ---- Sliders / botones ----
  if(demoOn){
    demoTimer += dt;
    // Velocidad oscila 60-130 km/h
    drive.targetSpeed = (95 + 35*Math.sin(demoTimer*0.5)) / 3.6;
    // Volante sigue una onda
    drive.steer = 0.6*Math.sin(demoTimer*0.75) + 0.25*Math.sin(demoTimer*1.7);
    drive.steer = clamp(drive.steer, -1, 1);
    $('steerS').value = Math.round(drive.steer*100);
    $('spdS').value   = Math.round(drive.targetSpeed*3.6);
    updateLabels();
  }

  // ---- Aceleración / freno ----
  const accel = drive.braking ? -14 : 3.5;
  drive.speed += (drive.targetSpeed - drive.speed) * (drive.braking ? 4*dt : 1.6*dt);
  drive.speed = Math.max(0, drive.speed);

  // ---- Avance sobre la spline ----
  const ds = drive.speed * dt;
  drive.t = (drive.t + ds / roadLength) % 1;
  if(drive.t < 0) drive.t += 1;

  // ---- Curvatura REAL de la spline en este punto ----
  const t0 = drive.t;
  const tA = (t0 + 0.003) % 1;
  const tB = (t0 - 0.003 + 1) % 1;
  const pA = roadCurve.getPointAt(tA);
  const pB = roadCurve.getPointAt(tB);
  const pC = roadCurve.getPointAt(t0);
  const v1 = new THREE.Vector3().subVectors(pC, pB);
  const v2 = new THREE.Vector3().subVectors(pA, pC);
  const crossY = v1.x*v2.z - v1.z*v2.x;
  const dotXY  = v1.x*v2.x + v1.z*v2.z;
  let angle = Math.atan2(crossY, dotXY);      // radianes por paso
  // Normalizar a -100..100
  drive.curvature = clamp(angle * 900, -100, 100);

  // ---- Offset lateral controlado por el volante ----
  // El volante empuja el coche hacia un lado, pero la curvatura tira de él hacia el exterior
  const steerEffect = drive.steer * 1.4;
  const curveEffect = -drive.curvature / 100 * 0.35;
  drive.lateral += (steerEffect + curveEffect) * dt * 3.0;
  drive.lateral *= 0.96; // vuelve al centro poco a poco
  drive.lateral = clamp(drive.lateral, -MAX_LATERAL, MAX_LATERAL);

  // ---- Posición sobre la pista ----
  const p = roadCurve.getPointAt(drive.t);
  const tan = roadCurve.getTangentAt(drive.t).normalize();
  const up = new THREE.Vector3(0,1,0);
  const nor = new THREE.Vector3().crossVectors(up, tan).normalize();

  carGroup.position.set(
    p.x + nor.x * drive.lateral,
    0,
    p.z + nor.z * drive.lateral
  );

  // ---- Heading: tangente + un poco de la dirección ----
  const baseHeading = Math.atan2(tan.x, tan.z);
  const steerHeading = -drive.steerSmooth * 0.30;   // -17° visuales
  drive.heading = baseHeading + steerHeading;
  carGroup.rotation.y = drive.heading;

  // ---- Pitch/Roll sutiles para dar vida ----
  drive.pitch = -drive.speed * 0.0035;             // morro abajo al acelerar
  drive.roll  = clamp(drive.curvature * 0.006, -0.15, 0.15)
              + drive.steerSmooth * 0.08;
  carBody.rotation.z = lerp(carBody.rotation.z, drive.roll, 1-Math.exp(-6*dt));
  carBody.rotation.x = lerp(carBody.rotation.x, drive.pitch, 1-Math.exp(-6*dt));

  // ---- Ruedas: girar delanteras ----
  drive.steerSmooth = lerp(drive.steerSmooth, drive.steer, 1-Math.exp(-8*dt));
  const wheelAngle = drive.steerSmooth * 0.55;      // ~31° máx
  if(wheels.fl){ wheels.fl.rotation.y = (wheels.fl.userData.baseRotY||0) + wheelAngle; }
  if(wheels.fr){ wheels.fr.rotation.y = (wheels.fr.userData.baseRotY||0) + wheelAngle; }

  // ---- Curvatura exponencial para la cámara ----
  camRollTarget = -drive.curvature * 0.0025
                + drive.steerSmooth * 0.05;
  camRollTarget = clamp(camRollTarget, -0.12, 0.12);

  // ---- Estado global ----
  window.TESLA_STATE.speed      = drive.speed * 3.6;
  window.TESLA_STATE.speedMs    = drive.speed;
  window.TESLA_STATE.curvature  = drive.curvature;
  window.TESLA_STATE.heading    = (drive.heading * 180/Math.PI + 360) % 360;
  window.TESLA_STATE.steering   = drive.steerSmooth;
  window.TESLA_STATE.braking    = drive.braking;
  window.TESLA_STATE.raining    = raining;
  window.TESLA_STATE.dayNight   = dayNightT;
  window.TESLA_STATE.timestamp  = performance.now();
  // Lat/lon simulados: hacemos que la posición sobre la curva se traduzca en coords
  window.TESLA_STATE.lat = 40.4168 + Math.sin(drive.t*Math.PI*2) * 0.01;
  window.TESLA_STATE.lon = -3.7038 + Math.cos(drive.t*Math.PI*2) * 0.01;

  // Autoboard: postMessage (silencioso si no hay parent)
  if(window.parent !== window){
    try{ window.parent.postMessage({type:'TESLA_STATE', payload: window.TESLA_STATE}, '*'); }catch(e){}
  }
}

/* ============================================================
   9. CÁMARA (perseguidor / conductor)
   ============================================================ */
let camRoll = 0, camRollTarget = 0;
const camPosSmooth = new THREE.Vector3(0, 6, -12);
let viewMode = 'chase';

function updateCamera(dt){
  if(viewMode === 'chase'){
    const speedFactor = clamp(drive.speed / 40, 0, 1);
    const dist  = lerp(9.5, 12.5, speedFactor);
    const height= lerp(4.2, 4.8, speedFactor);

    // Punto detrás del coche
    const back = new THREE.Vector3(
      -Math.sin(drive.heading),
      0,
      -Math.cos(drive.heading)
    );
    const target = new THREE.Vector3()
      .copy(carGroup.position)
      .addScaledVector(back, dist)
      .setY(height);

    camPosSmooth.lerp(target, 1-Math.exp(-6*dt));
    camera.position.copy(camPosSmooth);

    // Mira un poco delante del coche
    const lookAt = new THREE.Vector3()
      .copy(carGroup.position)
      .addScaledVector(back, -6)
      .setY(1.0);
    camera.lookAt(lookAt);

    // Roll suave por curvatura
    camRoll = lerp(camRoll, camRollTarget, 1-Math.exp(-4*dt));
    camera.rotateZ(camRoll);
  } else {
    // Vista conductor: dentro, mirando al frente
    const fwd = new THREE.Vector3(
      Math.sin(drive.heading),
      0,
      Math.cos(drive.heading)
    );
    const target = new THREE.Vector3()
      .copy(carGroup.position)
      .addScaledVector(fwd, 0.2)
      .setY(1.55);
    camPosSmooth.lerp(target, 1-Math.exp(-10*dt));
    camera.position.copy(camPosSmooth);
    const lookAt = new THREE.Vector3()
      .copy(carGroup.position)
      .addScaledVector(fwd, 12)
      .setY(1.35);
    camera.lookAt(lookAt);
    camera.rotateZ(camRollTarget * 0.4);
  }
}

/* ============================================================
   10. LLUVIA
   ============================================================ */
const rainCanvas = $('rain');
const rctx = rainCanvas.getContext('2d');
let rainDrops = [];
let raining = false;

function resizeRain(){
  rainCanvas.width  = innerWidth;
  rainCanvas.height = innerHeight;
  const N = Math.round((innerWidth*innerHeight)/14000);
  rainDrops = new Array(N).fill(0).map(()=>({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    len: 6 + Math.random()*14,
    spd: 6 + Math.random()*10,
    op:  0.10 + Math.random()*0.35
  }));
}
resizeRain();

function drawRain(dt){
  rctx.clearRect(0,0,rainCanvas.width,rainCanvas.height);
  if(!raining) return;
  rctx.lineWidth = 1.2;
  rctx.strokeStyle = 'rgba(180,205,235,0.55)';
  for(const d of rainDrops){
    rctx.globalAlpha = d.op;
    rctx.beginPath();
    rctx.moveTo(d.x, d.y);
    rctx.lineTo(d.x - 1.5, d.y + d.len);
    rctx.stroke();
    d.y += d.spd * 60 * dt;
    d.x -= 1.5 * 60 * dt;
    if(d.y > rainCanvas.height + 20){ d.y = -20; d.x = Math.random()*innerWidth; }
    if(d.x < -20){ d.x = innerWidth + 20; }
  }
  rctx.globalAlpha = 1;
}

/* ============================================================
   11. HUD
   ============================================================ */
const arcProg = $('arcProg');
const arcTrack = $('arcTrack');
const arcLen = arcTrack.getTotalLength();
arcProg.style.strokeDasharray = arcLen;
arcProg.style.strokeDashoffset = arcLen;

function setArcProgress(v01){
  const off = arcLen * (1 - clamp(v01,0,1));
  arcProg.style.strokeDashoffset = off;
  // Color del arco
  let c;
  if(v01 < 0.5) c = '#39d98a';
  else if(v01 < 0.8) c = '#f5b942';
  else c = '#ef5350';
  arcProg.style.stroke = c;
}

const curvFill = $('curvFill');
function setCurvBar(curv){
  const v = clamp(curv, -100, 100);
  const pct = Math.abs(v);
  if(v >= 0){
    curvFill.style.left = '50%';
    curvFill.style.width = (pct/2) + '%';
  } else {
    curvFill.style.left = (50 - pct/2) + '%';
    curvFill.style.width = (pct/2) + '%';
  }
}

function updateHUD(){
  const spd = window.TESLA_STATE.speed;
  $('spdNum').textContent = Math.round(spd);
  setArcProgress(spd / 200);

  setCurvBar(window.TESLA_STATE.curvature);
  $('infoCurv').textContent = Math.round(window.TESLA_STATE.curvature);
  $('infoHdg').textContent  = Math.round(window.TESLA_STATE.heading) + '°';
  $('infoView').textContent = viewMode === 'chase' ? 'Perseguidor' : 'Conductor';

  const chipBrake = $('chipBrake');
  chipBrake.classList.toggle('on', drive.braking);
  chipBrake.classList.toggle('warn', false);

  const chipRain = $('chipRain');
  chipRain.textContent = raining ? '🌧️ LLUVIA' : '🌧️ SECO';
  chipRain.classList.toggle('on', raining);

  const chipDay = $('chipDay');
  chipDay.textContent = dayNightT > 0.5 ? '☀️ DÍA' : '🌙 NOCHE';
  chipDay.classList.toggle('on', dayNightT > 0.5);
}

/* ============================================================
   12. CONTROLES
   ============================================================ */
const spdS   = $('spdS');
const steerS = $('steerS');
const spdV   = $('spdV');
const steerV = $('steerV');

function updateLabels(){
  const sv = parseFloat(steerS.value);
  if(Math.abs(sv) < 5)  steerV.textContent = 'centro';
  else if(sv < 0)       steerV.textContent = 'izquierda ' + Math.abs(Math.round(sv)) + '%';
  else                  steerV.textContent = 'derecha ' + Math.round(sv) + '%';
  spdV.textContent = Math.round(parseFloat(spdS.value)) + ' km/h';
}

spdS.addEventListener('input', ()=>{
  demoOn = false; $('bDemo').classList.remove('on');
  drive.targetSpeed = parseFloat(spdS.value)/3.6;
  updateLabels();
});
steerS.addEventListener('input', ()=>{
  demoOn = false; $('bDemo').classList.remove('on');
  drive.steer = parseFloat(steerS.value)/100;
  updateLabels();
});

$('bL').onclick = ()=>{ demoOn=false; $('bDemo').classList.remove('on'); steerS.value=-70; drive.steer=-0.7; updateLabels(); };
$('bS').onclick = ()=>{ demoOn=false; $('bDemo').classList.remove('on'); steerS.value=0;   drive.steer=0;    updateLabels(); };
$('bR').onclick = ()=>{ demoOn=false; $('bDemo').classList.remove('on'); steerS.value=70;  drive.steer=0.7;  updateLabels(); };

$('bBrake').onclick = ()=>{ drive.braking = !drive.braking; $('bBrake').classList.toggle('on', drive.braking); };
$('bRain').onclick  = ()=>{ raining = !raining; $('bRain').classList.toggle('on', raining); };
$('bDay').onclick   = ()=>{ isDay=true;  $('bDay').classList.add('on');  $('bNight').classList.remove('on'); };
$('bNight').onclick = ()=>{ isDay=false; $('bNight').classList.add('on'); $('bDay').classList.remove('on'); };

$('bCam').onclick = ()=>{ viewMode = viewMode==='chase'?'cockpit':'chase'; window.TESLA_STATE.view = viewMode; };

$('bDemo').onclick = ()=>{
  demoOn = !demoOn;
  $('bDemo').classList.toggle('on', demoOn);
  if(demoOn) demoTimer = 0;
};

$('col').addEventListener('input', ()=>{
  const hex = $('col').value;
  $('colV').textContent = hex;
  if(bodyMaterial && bodyMaterial.color){
    bodyMaterial.color.set(hex);
  }
});

// Teclado
addEventListener('keydown', (e)=>{
  if(e.key === 'h' || e.key === 'H'){
    $('panel').classList.toggle('hidden');
  }
  if(e.key === 'c' || e.key === 'C'){
    viewMode = viewMode==='chase'?'cockpit':'chase';
    window.TESLA_STATE.view = viewMode;
  }
  if(e.key === 'ArrowLeft' || e.key==='a' || e.key==='A'){
    demoOn=false; $('bDemo').classList.remove('on');
    steerS.value = Math.max(-100, parseFloat(steerS.value)-8);
    drive.steer = parseFloat(steerS.value)/100;
    updateLabels();
  }
  if(e.key === 'ArrowRight' || e.key==='d' || e.key==='D'){
    demoOn=false; $('bDemo').classList.remove('on');
    steerS.value = Math.min(100, parseFloat(steerS.value)+8);
    drive.steer = parseFloat(steerS.value)/100;
    updateLabels();
  }
  if(e.key === 'ArrowUp' || e.key==='w' || e.key==='W'){
    spdS.value = Math.min(200, parseFloat(spdS.value)+5);
    drive.targetSpeed = parseFloat(spdS.value)/3.6;
    updateLabels();
  }
  if(e.key === 'ArrowDown' || e.key==='s' || e.key==='S'){
    spdS.value = Math.max(0, parseFloat(spdS.value)-5);
    drive.targetSpeed = parseFloat(spdS.value)/3.6;
    updateLabels();
  }
  if(e.key === ' '){ drive.braking = !drive.braking; $('bBrake').classList.toggle('on', drive.braking); }
});

/* ============================================================
   13. RESIZE
   ============================================================ */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  resizeRain();
}
addEventListener('resize', resize);

/* ============================================================
   14. LOOP
   ============================================================ */
let last = performance.now();
let fpsAcc = 0, fpsN = 0, fpsT = 0;

function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;

  // Suavizado día/noche
  const target = isDay ? 1 : 0;
  if(dayNightT !== target){
    dayNightT = lerp(dayNightT, target, 1-Math.exp(-2*dt));
    if(Math.abs(dayNightT-target)<0.005) dayNightT = target;
    applyDayNight();
  }

  updateDrive(dt);
  updateCamera(dt);
  drawRain(dt);
  updateHUD();

  // FPS
  fpsAcc += dt; fpsN++; fpsT += dt;
  if(fpsT > 0.5){
    $('infoFps').textContent = Math.round(fpsN/fpsAcc);
    fpsAcc = 0; fpsN = 0; fpsT = 0;
  }

  renderer.render(scene, camera);
}

/* ============================================================
   15. INIT
   ============================================================ */
applyDayNight();
updateLabels();
resize();
tick();

// Exponer por si Autoboard quiere leer en cualquier momento
window.TeslaNav = {
  getState(){ return window.TESLA_STATE; },
  setSpeed(kmh){ spdS.value = kmh; drive.targetSpeed = kmh/3.6; updateLabels(); },
  setSteer(v){ steerS.value = clamp(v,-1,1)*100; drive.steer = clamp(v,-1,1); updateLabels(); },
  setRain(b){ raining = !!b; $('bRain').classList.toggle('on', raining); },
  setDay(b){ isDay = !!b; $('bDay').classList.toggle('on', isDay); $('bNight').classList.toggle('on', !isDay); },
  setView(v){ viewMode = v==='cockpit'?'cockpit':'chase'; window.TESLA_STATE.view = viewMode; }
};

})();
</script>
