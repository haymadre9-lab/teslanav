<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Nav — Simulador 3D</title>
<style>
  :root{
    --bg:#05070d; --txt:#e7eaf0; --dim:#9aa3b2; --bd:#26303f;
    --ok:#39d98a; --warn:#f5b942; --bad:#ef5350; --accent:#39d98a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;}
  #stage{position:absolute;inset:0;
    background:linear-gradient(#0a1526 0%,#0e2038 30%,#0b1322 46%,#070b13 100%);}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #rain{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;}
  #hud{position:absolute;inset:0;z-index:6;pointer-events:none;}

  .speedo{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    width:230px;height:150px;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.55));
  }
  .speedo svg{width:100%;height:100%;display:block;}
  .speedo .track{fill:none;stroke:#1b2130;stroke-width:10;stroke-linecap:round;}
  .speedo .prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;
    transition:stroke .25s ease;}
  .speedo .num{font-size:44px;font-weight:800;fill:#fff;letter-spacing:-1px;}
  .speedo .unit{font-size:11px;font-weight:700;fill:var(--dim);letter-spacing:2px;}

  .curv{
    position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
    width:180px;height:6px;border-radius:3px;background:#1b2130;overflow:hidden;
  }
  .curv::after{
    content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#2b3648;
    transform:translateX(-1px);
  }
  .curv .fill{
    position:absolute;top:0;bottom:0;left:50%;width:0;
    background:linear-gradient(90deg,var(--accent),var(--warn));
    transition:width .1s linear,left .1s linear;
  }

  .status{
    position:absolute;top:14px;right:14px;display:flex;gap:8px;align-items:center;
    flex-wrap:wrap;justify-content:flex-end;max-width:60vw;
  }
  .chip{
    background:rgba(16,18,24,.72);border:1px solid var(--bd);
    border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;
    color:var(--dim);display:flex;gap:6px;align-items:center;
    backdrop-filter:blur(6px);
  }
  .chip.on{color:#04130c;background:var(--ok);border-color:var(--ok);}
  .chip.warn{color:#1a1200;background:var(--warn);border-color:var(--warn);}
  .chip.info{color:#e7eaf0;background:rgba(57,217,138,.18);border-color:var(--ok);}

  .info{
    position:absolute;left:12px;bottom:12px;
    background:rgba(16,18,24,.72);border:1px solid var(--bd);
    border-radius:10px;padding:6px 10px;font-size:11px;color:var(--dim);
    line-height:1.5;backdrop-filter:blur(6px);
  }
  .info b{color:var(--txt);font-weight:800;}

  #panel{
    position:absolute;left:50%;top:8px;transform:translateX(-50%);
    width:min(96vw,840px);
    background:rgba(14,16,22,.84);border:1px solid var(--bd);
    border-radius:14px;padding:8px 11px;z-index:30;
    backdrop-filter:blur(8px);
    transition:opacity .25s ease,transform .25s ease;
  }
  #panel.hidden{opacity:0;transform:translate(-50%,-130%);pointer-events:none;}
  #panel .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  #panel .row+.row{margin-top:7px;}
  #panel label{font-size:12px;color:var(--dim);min-width:62px;}
  #panel input[type=range]{flex:1;min-width:120px;accent-color:var(--ok);}
  #panel button{
    border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;
    cursor:pointer;background:#1b2130;color:var(--txt);transition:.15s;
  }
  #panel button:hover{background:#242c3d;}
  #panel button.g{background:var(--ok);color:#04130c;}
  #panel button.on{outline:2px solid var(--ok);}
  #panel input[type=color]{
    width:34px;height:30px;border:0;border-radius:8px;background:none;padding:0;cursor:pointer;
  }
  .val{min-width:62px;text-align:right;font-weight:800;font-size:12px;}

  #msg{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:8;background:rgba(16,18,24,.92);border:1px solid var(--bd);
    border-radius:12px;padding:14px 18px;font-size:14px;
    display:flex;gap:10px;align-items:center;
  }
  #msg .dot{
    width:10px;height:10px;border-radius:50%;background:var(--accent);
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .loader{
    width:200px;height:6px;background:#1b2130;border-radius:3px;overflow:hidden;margin-top:8px;
  }
  .loader .bar{height:100%;width:0;background:var(--accent);transition:width .15s linear;}

  @media (max-width:600px){
    #panel{width:96vw;padding:6px 8px;}
    #panel label{min-width:auto;font-size:11px;}
    #panel button{padding:6px 8px;font-size:11px;}
    .speedo{width:190px;height:124px;bottom:16px;}
    .speedo .num{font-size:36px;}
    .info{font-size:10px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="rain"></canvas>

  <div id="hud">
    <div class="status">
      <div class="chip info" id="chipLanes">🛣️ 3 carriles</div>
      <div class="chip" id="chipBrake">🛑 FRENO</div>
      <div class="chip" id="chipRain">🌧️ SECO</div>
      <div class="chip on" id="chipDay">☀️ DÍA</div>
      <div class="chip" id="chipGps">🛰️ GPS OFF</div>
    </div>

    <div class="speedo">
      <svg viewBox="0 0 230 150" preserveAspectRatio="xMidYMid meet">
        <path class="track" id="arcTrack" d="M25,125 A90,90 0 0 1 205,125"/>
        <path class="prog"  id="arcProg"  d="M25,125 A90,90 0 0 1 205,125"/>
        <text class="num" id="spdNum" x="115" y="105" text-anchor="middle">0</text>
        <text class="unit" id="spdUnit" x="115" y="128" text-anchor="middle">KM/H</text>
      </svg>
    </div>
    <div class="curv"><div class="fill" id="curvFill"></div></div>

    <div class="info">
      <div>Vista: <b id="infoView">Perseguidor</b> · Curvatura: <b id="infoCurv">0</b></div>
      <div>Heading: <b id="infoHdg">0°</b> · FPS: <b id="infoFps">–</b></div>
      <div>Distancia: <b id="infoDist">0</b> m · <b>H</b> panel</div>
    </div>
  </div>

  <div id="panel">
    <div class="row">
      <label>Velocidad</label>
      <input id="spdS" type="range" min="0" max="220" value="80">
      <span class="val" id="spdV">80 km/h</span>
    </div>
    <div class="row">
      <label>Volante</label>
      <input id="steerS" type="range" min="-100" max="100" value="0">
      <span class="val" id="steerV">centro</span>
    </div>
    <div class="row">
      <button id="bL">↰ Izq</button>
      <button id="bS">↑ Recto</button>
      <button id="bR">↱ Dcha</button>
      <button id="bBrake">🛑 Freno</button>
      <button id="bRain">🌧️ Lluvia</button>
      <button id="bDay" class="on">☀️ Día</button>
      <button id="bNight">🌙 Noche</button>
      <button id="bCam">🎥 Vista</button>
    </div>
    <div class="row">
      <button id="bDemo" class="g">▶ Demo</button>
      <button id="bAuto">🎢 Auto-curvas</button>
      <button id="bGps">🛰️ GPS</button>
      <label style="min-width:auto">Color</label>
      <input id="col" type="color" value="#7d838c">
      <span class="val" id="colV" style="min-width:80px">#7d838c</span>
    </div>
  </div>

  <div id="msg">
    <span class="dot"></span>
    <div>
      <div id="msgTxt">Cargando car.glb…</div>
      <div class="loader" id="loaderBox"><div class="bar" id="loadBar"></div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(function(){
'use strict';

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
window.TESLA_STATE = {
  speed: 0, speedMs: 0, curvature: 0, heading: 0,
  lat: 40.4168, lon: -3.7038, alt: null, accuracy: null,
  steering: 0, braking: false, raining: false, dayNight: 1,
  view: 'chase', lanes: 3, wheelsDetected: false,
  lane: 'right',
  gps: { enabled: false, simulated: true, active: false },
  distance: 0, loaded: false, timestamp: 0
};

const $ = (id)=>document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const wrapPi = (a)=>{ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };

/* ============================================================
   RENDERER / ESCENA / CÁMARA
   ============================================================ */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = false;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a2540, 100, 400);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);

// El MUNDO entero se traslada y rota. Los segmentos viven aquí.
const worldGroup = new THREE.Group();
scene.add(worldGroup);

/* ============================================================
   LUCES
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xcfe2ff, 0x182030, 0.95);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2dc, 1.05);
sun.position.set(80, 120, 60);
scene.add(sun);
scene.add(sun.target);

const ambient = new THREE.AmbientLight(0x2a3a55, 0.5);
scene.add(ambient);

let isDay = true;
let dayNightT = 1;

function applyDayNight(){
  const t = dayNightT;
  sun.intensity     = lerp(0.05, 1.05, t);
  hemi.intensity    = lerp(0.20, 0.95, t);
  ambient.intensity = lerp(0.30, 0.50, t);
  hemi.color.setHSL(0.58, 0.4, lerp(0.15, 0.85, t));
  sun.color.setHSL(0.10, 0.4, lerp(0.55, 0.80, t));
  scene.fog.color.setHSL(0.60, 0.35, lerp(0.04, 0.14, t));
  renderer.toneMappingExposure = lerp(0.70, 1.10, t);
}

/* ============================================================
   TEXTURAS
   ============================================================ */
function makeAsphaltTexture(){
  const s = 512;
  const c = document.createElement('canvas'); c.width=s; c.height=s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a4048'; ctx.fillRect(0,0,s,s);
  const img = ctx.getImageData(0,0,s,s);
  const d = img.data;
  for(let i=0;i<d.length;i+=4){
    const n = (Math.random()*50)|0;
    d[i]   = clamp(d[i]+n-25, 0, 255);
    d[i+1] = clamp(d[i+1]+n-25, 0, 255);
    d[i+2] = clamp(d[i+2]+n-25, 0, 255);
  }
  ctx.putImageData(img,0,0);
  for(let i=0;i<250;i++){
    const x=Math.random()*s, y=Math.random()*s;
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.06})`;
    ctx.fillRect(x,y,1,1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.encoding = THREE.sRGBEncoding;
  if(renderer.capabilities.getMaxAnisotropy){
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  return tex;
}

function makeGroundTexture(){
  const s = 256;
  const c = document.createElement('canvas'); c.width=s; c.height=s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#181c24'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<1200;i++){
    const x=Math.random()*s, y=Math.random()*s;
    const v = 25 + (Math.random()*20|0);
    ctx.fillStyle = `rgb(${v},${v},${v+4})`;
    ctx.fillRect(x,y,1+(Math.random()*2|0),1+(Math.random()*2|0));
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

const asphaltTex = makeAsphaltTexture();
const groundTex  = makeGroundTexture();

/* ============================================================
   CARRETERA INFINITA
   ------------------------------------------------------------
   Cada segmento guarda su posición MUNDIAL FIJA (x, z) y su yaw.
   NO se recalculan. El mundo se desplaza como un todo.
   ============================================================ */
const SEG_LEN    = 2.0;
const SEG_COUNT  = 300;
const LANE_WIDTH = 3.6;
const LANES      = 3;
const HALF_WIDTH = (LANES * LANE_WIDTH) / 2;
const CAR_OFFSET = LANE_WIDTH;

// Anillo de segmentos. head = último generado.
const segX   = new Float32Array(SEG_COUNT);
const segZ   = new Float32Array(SEG_COUNT);
const segYaw = new Float32Array(SEG_COUNT);
let headIdx = 0;

// Cursor de generación (posición mundial donde se generará el próximo segmento)
let genX = 0, genZ = 0, genYaw = 0;

// Curvatura actual (afecta solo a nuevos segmentos)
let bendCurrent = 0;
let bendTarget  = 0;

// Número de segmentos ya generados (para saber cuántos hay válidos al inicio)
let segValidCount = 0;

// Buffers de malla
const roadMaxVerts = SEG_COUNT * 2;
const roadPos = new Float32Array(roadMaxVerts * 3);
const roadUV  = new Float32Array(roadMaxVerts * 2);
const roadPosAttr = new THREE.BufferAttribute(roadPos, 3);
const roadUVAttr  = new THREE.BufferAttribute(roadUV, 2);
roadPosAttr.setUsage(THREE.DynamicDrawUsage);
roadUVAttr.setUsage(THREE.DynamicDrawUsage);

const roadIndices = [];
for(let i=0;i<SEG_COUNT-1;i++){
  const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
  roadIndices.push(a,b,c, b,d,c);
}

const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', roadPosAttr);
roadGeo.setAttribute('uv', roadUVAttr);
roadGeo.setIndex(roadIndices);

const roadMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: asphaltTex,
  roughness: 0.85,
  metalness: 0.08,
  side: THREE.DoubleSide,
});
const roadMesh = new THREE.Mesh(roadGeo, roadMat);
roadMesh.frustumCulled = false;
worldGroup.add(roadMesh);

function makeStrip(color, y, opacity){
  const posArr = new Float32Array(roadMaxVerts * 3);
  const geo = new THREE.BufferGeometry();
  const attr = new THREE.BufferAttribute(posArr, 3);
  attr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', attr);
  geo.setIndex(roadIndices.slice());
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent:true, opacity, depthWrite:false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.userData.y = y;
  return mesh;
}

const lineEdgeL = makeStrip(0xffffff, 0.02, 0.85);
const lineEdgeR = makeStrip(0xffffff, 0.02, 0.85);
const laneLineA = makeStrip(0xffffff, 0.03, 0.70);
const laneLineB = makeStrip(0xffffff, 0.03, 0.70);
worldGroup.add(lineEdgeL, lineEdgeR, laneLineA, laneLineB);

/* ============================================================
   SUELO (Sigue al mundo para que no se vea el borde)
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshStandardMaterial({ color: 0x252a33, map: groundTex, roughness: 1.0 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.06;
worldGroup.add(ground);

/* ============================================================
   COCHE (fijo en escena, no en worldGroup)
   ============================================================ */
const carGroup = new THREE.Group();
const carBody  = new THREE.Group();
carGroup.add(carBody);
scene.add(carGroup);

const shadowBlob = new THREE.Mesh(
  new THREE.PlaneGeometry(5.2, 2.6),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.35, depthWrite:false })
);
shadowBlob.rotation.x = -Math.PI/2;
shadowBlob.position.y = 0.03;
carGroup.add(shadowBlob);

let carModel = null;
const wheels = { fl:null, fr:null, rl:null, rr:null };
let bodyMaterial = null;
const WHEEL_RE = /(wheel|tire|tyre|rueda|llanta|neumatic|pneu|roue|rad)/i;

// Ajustes del modelo. Modifica si sale mal.
let CAR_MODEL_YAW_OFFSET = 0;
let CAR_MODEL_Y_OFFSET   = 0;

function setupCar(gltf){
  carModel = gltf.scene;

  // Escalar a ~4.6 m de largo
  const box = new THREE.Box3().setFromObject(carModel);
  const size = new THREE.Vector3(); box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 4.6 / maxDim;
  carModel.scale.setScalar(scale);

  // Rotación del modelo
  carModel.rotation.y = CAR_MODEL_YAW_OFFSET;
  carModel.updateMatrixWorld(true);

  // Recentrar
  const box2 = new THREE.Box3().setFromObject(carModel);
  const center = new THREE.Vector3(); box2.getCenter(center);
  carModel.position.x -= center.x;
  carModel.position.z -= center.z;
  carModel.position.y -= box2.min.y;
  carModel.position.y += CAR_MODEL_Y_OFFSET;

  // Materiales y ruedas
  let bestBodyMat = null;
  carModel.traverse(o=>{
    if(o.isMesh){
      o.castShadow = false; o.receiveShadow = false;
      if(o.material){
        const mats = Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>{
          if(!bestBodyMat && m.name && /body|paint|carroceria|shell/i.test(m.name)){
            bestBodyMat = m;
          }
        });
      }
    }
    if(o.name && WHEEL_RE.test(o.name)){
      const wp = new THREE.Vector3();
      o.getWorldPosition(wp);
      const local = carModel.worldToLocal(wp.clone());
      const isFront = local.z > 0;
      const isLeft  = local.x > 0;
      if(isFront && isLeft)  wheels.fl = o;
      if(isFront && !isLeft) wheels.fr = o;
      if(!isFront && isLeft) wheels.rl = o;
      if(!isFront && !isLeft)wheels.rr = o;
      o.userData.baseRotY = o.rotation.y;
      o.userData.baseRotX = o.rotation.x;
    }
  });

  if(!bestBodyMat){
    carModel.traverse(o=>{
      if(bestBodyMat) return;
      if(o.isMesh && o.material && (o.material.isMeshStandardMaterial || o.material.isMeshPhysicalMaterial)){
        bestBodyMat = o.material;
      }
    });
  }
  bodyMaterial = bestBodyMat;
  if(bodyMaterial && bodyMaterial.color){
    bodyMaterial.color.set($('col').value);
  }

  console.log('=== Nodos del coche ===');
  carModel.traverse(o=>{
    if(o.isMesh){
      const gcount = o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count;
      console.log('  ·', o.name || '(sin nombre)', '| tris:', gcount/3|0, '| mat:', o.material?.name || '(sin nombre)');
    }
  });
  console.log('Ruedas detectadas:', Object.keys(wheels).filter(k=>wheels[k]));

  window.TESLA_STATE.wheelsDetected = !!(wheels.fl||wheels.fr||wheels.rl||wheels.rr);
  carBody.add(carModel);
  window.TESLA_STATE.loaded = true;
  $('msg').style.display = 'none';
}

let loadTimeout = setTimeout(()=>{
  if(!window.TESLA_STATE.loaded){
    $('msgTxt').textContent = 'No se pudo cargar car.glb (revisa la consola)';
  }
}, 15000);

const loader = new THREE.GLTFLoader();
loader.load('./car.glb',
  (gltf)=>{ clearTimeout(loadTimeout); try{ setupCar(gltf); }catch(e){ console.error(e); $('msgTxt').textContent = 'Error al preparar el coche'; } },
  (ev)=>{
    if(ev.total){
      const pct = Math.round(ev.loaded/ev.total*100);
      $('msgTxt').textContent = 'Cargando car.glb… ' + pct + '%';
      $('loadBar').style.width = pct + '%';
    }
  },
  (err)=>{
    clearTimeout(loadTimeout);
    console.error(err);
    $('msgTxt').textContent = 'No se encontró car.glb (colócalo junto al index.html)';
  }
);

/* ============================================================
   GENERACIÓN DE CARRETERA
   ============================================================ */
function generateInitialRoad(){
  // Generamos SEG_COUNT segmentos desde atrás. Reservamos los primeros
  // 1/3 como "detrás" del coche, y los 2/3 restantes como "delante".
  headIdx = 0;
  genX = 0; genZ = 0; genYaw = 0;
  segValidCount = 0;

  // Generamos la primera mitad hacia atrás (yaw += PI)
  const behind = Math.floor(SEG_COUNT * 0.33);
  // Posicionamos el "origen" para que el segmento `behind` esté en (0,0)
  // Generamos de atrás hacia adelante:
  // Para simplificar, generamos con genYaw = 0 y curvatura 0.
  // Empezamos "lejos atrás" y vamos hacia delante.

  // Posición inicial temporal del cursor (lo colocaremos para que el segmento behind quede en 0,0)
  genX = 0; genZ = 0; genYaw = 0;
  // Generamos hacia atrás desde (0,0): retrocedemos
  // Para que el segmento `behind` esté en (0,0), generamos desde -behind*SEG_LEN hacia delante
  const startOffset = -behind * SEG_LEN;
  genX = 0; genZ = startOffset;
  genYaw = 0;

  for(let i=0;i<SEG_COUNT;i++){
    segX[i] = genX;
    segZ[i] = genZ;
    segYaw[i] = genYaw;
    genX += Math.sin(genYaw) * SEG_LEN;
    genZ += Math.cos(genYaw) * SEG_LEN;
  }
  headIdx = SEG_COUNT - 1;
  segValidCount = SEG_COUNT;
}

function pushSegment(){
  headIdx = (headIdx + 1) % SEG_COUNT;
  genYaw += bendCurrent * SEG_LEN;
  genX += Math.sin(genYaw) * SEG_LEN;
  genZ += Math.cos(genYaw) * SEG_LEN;
  segX[headIdx] = genX;
  segZ[headIdx] = genZ;
  segYaw[headIdx] = genYaw;
}

// Devuelve el índice del segmento i-ésimo contando desde el más antiguo (0) al más nuevo (SEG_COUNT-1)
function segRing(i){
  const idx = (headIdx + 1 + i) % SEG_COUNT;
  return idx;
}

/* ============================================================
   RECONSTRUCCIÓN DE LA MALLA
   ------------------------------------------------------------
   Aquí está la CLAVE: los segmentos NO se recolocan. Solo
   escribimos sus posiciones mundiales en el buffer. El
   worldGroup se encarga de mover TODO el conjunto.
   ============================================================ */
function rebuildRoadMesh(){
  let vi = 0;
  for(let i=0;i<SEG_COUNT;i++){
    const idx = segRing(i);
    const x = segX[idx];
    const z = segZ[idx];
    const yaw = segYaw[idx];
    const px = Math.cos(yaw);
    const pz = -Math.sin(yaw);

    roadPos[vi*3+0] = x - px * HALF_WIDTH;
    roadPos[vi*3+1] = 0;
    roadPos[vi*3+2] = z - pz * HALF_WIDTH;
    roadUV[vi*2+0] = 0; roadUV[vi*2+1] = i*0.35;
    vi++;

    roadPos[vi*3+0] = x + px * HALF_WIDTH;
    roadPos[vi*3+1] = 0;
    roadPos[vi*3+2] = z + pz * HALF_WIDTH;
    roadUV[vi*2+0] = 1; roadUV[vi*2+1] = i*0.35;
    vi++;
  }
  roadPosAttr.needsUpdate = true;
  roadUVAttr.needsUpdate = true;

  rebuildStrip(lineEdgeL, -HALF_WIDTH + 0.15, 0.08);
  rebuildStrip(lineEdgeR,  HALF_WIDTH - 0.15, 0.08);
  rebuildDashed(laneLineA, -HALF_WIDTH + LANE_WIDTH, 0.06);
  rebuildDashed(laneLineB,  HALF_WIDTH - LANE_WIDTH, 0.06);
}

function rebuildStrip(mesh, centerOffset, halfLineWidth){
  const arr = mesh.geometry.attributes.position.array;
  let vi = 0;
  for(let i=0;i<SEG_COUNT;i++){
    const idx = segRing(i);
    const x = segX[idx];
    const z = segZ[idx];
    const yaw = segYaw[idx];
    const px = Math.cos(yaw);
    const pz = -Math.sin(yaw);
    arr[vi*3+0] = x + px * (centerOffset - halfLineWidth);
    arr[vi*3+1] = mesh.userData.y;
    arr[vi*3+2] = z + pz * (centerOffset - halfLineWidth);
    vi++;
    arr[vi*3+0] = x + px * (centerOffset + halfLineWidth);
    arr[vi*3+1] = mesh.userData.y;
    arr[vi*3+2] = z + pz * (centerOffset + halfLineWidth);
    vi++;
  }
  mesh.geometry.attributes.position.needsUpdate = true;
}

function rebuildDashed(mesh, centerOffset, halfLineWidth){
  const arr = mesh.geometry.attributes.position.array;
  let vi = 0;
  const halfDash = SEG_LEN * 0.5;
  for(let i=0;i<SEG_COUNT-1;i+=2){
    const idx0 = segRing(i);
    const idx1 = segRing(i+1);
    const x0 = segX[idx0], z0 = segZ[idx0];
    const x1 = segX[idx1], z1 = segZ[idx1];
    const midx = (x0 + x1) * 0.5;
    const midz = (z0 + z1) * 0.5;
    const yaw  = segYaw[idx0];
    const px = Math.cos(yaw);
    const pz = -Math.sin(yaw);
    const dx = Math.sin(yaw);
    const dz = Math.cos(yaw);
    const bx = midx - dx * halfDash;
    const bz = midz - dz * halfDash;
    const fx = midx + dx * halfDash;
    const fz = midz + dz * halfDash;

    arr[vi*3+0] = bx + px*(centerOffset - halfLineWidth);
    arr[vi*3+1] = mesh.userData.y;
    arr[vi*3+2] = bz + pz*(centerOffset - halfLineWidth);
    vi++;
    arr[vi*3+0] = bx + px*(centerOffset + halfLineWidth);
    arr[vi*3+1] = mesh.userData.y;
    arr[vi*3+2] = bz + pz*(centerOffset + halfLineWidth);
    vi++;
    arr[vi*3+0] = fx + px*(centerOffset - halfLineWidth);
    arr[vi*3+1] = mesh.userData.y;
    arr[vi*3+2] = fz + pz*(centerOffset - halfLineWidth);
    vi++;
    arr[vi*3+0] = fx + px*(centerOffset + halfLineWidth);
    arr[vi*3+1] = mesh.userData.y;
    arr[vi*3+2] = fz + pz*(centerOffset + halfLineWidth);
    vi++;
  }
  for(let i=vi*3;i<arr.length;i++) arr[i] = 0;
  mesh.geometry.attributes.position.needsUpdate = true;
}

/* ============================================================
   CONDUCCIÓN
   ------------------------------------------------------------
   El coche está fijo en (0,0,0). El worldGroup se traslada y
   rota cada frame para que el "segmento ancla" quede en el origen
   mirando a +Z.
   ============================================================ */
const CAR_SEG_IDX = Math.floor(SEG_COUNT * 0.33); // índice del segmento ancla dentro del anillo

const drive = {
  speed: 80/3.6,
  targetSpeed: 80/3.6,
  steer: 0,
  steerSmooth: 0,
  braking: false,
  curvature: 0,
  pitch: 0,
  roll: 0,
  totalDistance: 0,
  heading: 0,
};

let demoOn = false;
let demoTimer = 0;
let autoCurves = false;
let autoTimer = 0;

let gpsWatchId = null;
let gpsEnabled = false;
let gpsActive = false;
const gpsSimBase = { lat: 40.4168, lon: -3.7038 };

// Distancia acumulada desde el último pushSegment
let pushAccum = 0;
// Cuántos segmentos han pasado "bajo el coche" desde el inicio
let carSegAdvance = 0;  // entero

// Progreso fraccional del coche dentro del segmento ancla [0,1)
let carSegFrac = 0;

function updateDrive(dt){
  if(demoOn){
    demoTimer += dt;
    drive.targetSpeed = (95 + 35*Math.sin(demoTimer*0.5)) / 3.6;
    drive.steer = clamp(0.6*Math.sin(demoTimer*0.7) + 0.25*Math.sin(demoTimer*1.6), -1, 1);
    $('steerS').value = Math.round(drive.steer*100);
    $('spdS').value   = Math.round(drive.targetSpeed*3.6);
    updateLabels();
  }
  if(autoCurves && !demoOn){
    autoTimer += dt;
    const auto = 0.55*Math.sin(autoTimer*0.35) + 0.25*Math.sin(autoTimer*0.9);
    drive.steer = clamp(auto, -0.85, 0.85);
    $('steerS').value = Math.round(drive.steer*100);
    updateLabels();
  }

  drive.speed += (drive.targetSpeed - drive.speed) * (drive.braking ? 4*dt : 1.6*dt);
  drive.speed = Math.max(0, drive.speed);
  drive.steerSmooth = lerp(drive.steerSmooth, drive.steer, 1-Math.exp(-8*dt));

  // Curvatura para nuevos segmentos
  bendTarget = drive.steerSmooth * 0.022;
  bendCurrent = lerp(bendCurrent, bendTarget, 1-Math.exp(-3*dt));
  drive.curvature = clamp(bendCurrent * 3000, -100, 100);

  // Avance
  const ds = drive.speed * dt;
  drive.totalDistance += ds;
  pushAccum += ds;

  // Cada SEG_LEN metros, generamos un nuevo segmento
  while(pushAccum >= SEG_LEN){
    pushAccum -= SEG_LEN;
    pushSegment();
    carSegAdvance++;
  }
  carSegFrac = pushAccum / SEG_LEN;

  // Reconstruimos la malla
  rebuildRoadMesh();

  // Obtenemos la pose del "segmento ancla" (donde está el coche)
  // El coche está sobre el segmento CAR_SEG_IDX del anillo (0..SEG_COUNT-1).
  // Como hemos avanzado carSegAdvance segmentos desde el inicio, el segmento
  // ancla es el que estaba en CAR_SEG_IDX originalmente + carSegAdvance.
  const anchorRingIdx = (CAR_SEG_IDX + carSegAdvance) % SEG_COUNT;
  const anchorWorldIdx = segRing(anchorRingIdx);

  // Para que la interpolación sea suave, interpolamos entre el segmento
  // ancla y el siguiente.
  const nextRingIdx = (anchorRingIdx + 1) % SEG_COUNT;
  const nextWorldIdx = segRing(nextRingIdx);

  const ax = segX[anchorWorldIdx];
  const az = segZ[anchorWorldIdx];
  const ayaw = segYaw[anchorWorldIdx];
  const nx = segX[nextWorldIdx];
  const nz = segZ[nextWorldIdx];
  const nyaw = segYaw[nextWorldIdx];

  // Posición interpolada del coche en mundo
  const carWorldX = lerp(ax, nx, carSegFrac);
  const carWorldZ = lerp(az, nz, carSegFrac);
  // Yaw interpolado
  const dYaw = wrapPi(nyaw - ayaw);
  const carWorldYaw = ayaw + dYaw * carSegFrac;

  // *** CLAVE: mover worldGroup para que el coche quede en (0,0) mirando a +Z ***
  // El coche está en (carWorldX, carWorldZ) con yaw carWorldYaw.
  // Queremos que ese punto se vea en (0,0) y mirando a +Z (yaw=0).
  // Traslación: -carWorldX, -carWorldZ
  // Rotación: -carWorldYaw
  worldGroup.position.set(-carWorldX, 0, -carWorldZ);
  worldGroup.rotation.y = -carWorldYaw;

  // Aplicar rotación correctamente a la posición:
  // Three.js aplica primero scale, luego rotation, luego translation.
  // Pero worldGroup.position se aplica DESPUÉS de la rotación.
  // Entonces necesitamos rotar el offset manualmente:
  // worldGroup.rotation.y rotará todo, y luego se traslada.
  // Para que el punto (carWorldX, carWorldZ) acabe en (0,0):
  //   R(-yaw) * (carWorldX, carWorldZ) + T = (0,0)
  //   T = -R(-yaw) * (carWorldX, carWorldZ)
  const cos = Math.cos(-carWorldYaw);
  const sin = Math.sin(-carWorldYaw);
  const rx = cos * carWorldX - sin * carWorldZ;
  const rz = sin * carWorldX + cos * carWorldZ;
  worldGroup.position.set(-rx, 0, -rz);
  worldGroup.rotation.y = -carWorldYaw;

  // El coche queda en (0,0,0) y sin rotación adicional
  carGroup.position.set(0, 0, 0);
  carGroup.rotation.y = 0;

  drive.heading = carWorldYaw;

  // Roll y pitch MUY suaves (máximo ~2°)
  const targetRoll  = clamp(drive.steerSmooth * 0.035, -0.035, 0.035);
  const targetPitch = clamp(-drive.speed * 0.0008, -0.02, 0.02);
  carBody.rotation.z = lerp(carBody.rotation.z, targetRoll,  1-Math.exp(-4*dt));
  carBody.rotation.x = lerp(carBody.rotation.x, targetPitch, 1-Math.exp(-4*dt));

  // Ruedas
  const wheelSteer = drive.steerSmooth * 0.45;
  const wheelSpin  = (drive.speed * dt) / 0.33;
  if(wheels.fl){
    wheels.fl.rotation.y = (wheels.fl.userData.baseRotY||0) + wheelSteer;
    wheels.fl.rotation.x = (wheels.fl.userData.baseRotX||0) + wheelSpin;
  }
  if(wheels.fr){
    wheels.fr.rotation.y = (wheels.fr.userData.baseRotY||0) + wheelSteer;
    wheels.fr.rotation.x = (wheels.fr.userData.baseRotX||0) + wheelSpin;
  }
  if(wheels.rl){ wheels.rl.rotation.x = (wheels.rl.userData.baseRotX||0) + wheelSpin; }
  if(wheels.rr){ wheels.rr.rotation.x = (wheels.rr.userData.baseRotX||0) + wheelSpin; }

  // Estado
  window.TESLA_STATE.speed     = drive.speed * 3.6;
  window.TESLA_STATE.speedMs   = drive.speed;
  window.TESLA_STATE.curvature = drive.curvature;
  window.TESLA_STATE.heading   = ((carWorldYaw * 180/Math.PI) + 360) % 360;
  window.TESLA_STATE.steering  = drive.steerSmooth;
  window.TESLA_STATE.braking   = drive.braking;
  window.TESLA_STATE.raining   = raining;
  window.TESLA_STATE.dayNight  = dayNightT;
  window.TESLA_STATE.distance  = drive.totalDistance;
  window.TESLA_STATE.timestamp = performance.now();

  if(!gpsActive){
    const latDelta = (drive.totalDistance / 111320) * Math.cos(carWorldYaw);
    const lonDelta = (drive.totalDistance / (111320*Math.cos(gpsSimBase.lat*Math.PI/180))) * Math.sin(carWorldYaw);
    window.TESLA_STATE.lat = gpsSimBase.lat + latDelta * 0.001;
    window.TESLA_STATE.lon = gpsSimBase.lon + lonDelta * 0.001;
  }
  window.TESLA_STATE.gps.enabled   = gpsEnabled;
  window.TESLA_STATE.gps.simulated = !gpsActive;
  window.TESLA_STATE.gps.active    = gpsActive;

  if(window.parent !== window){
    try{ window.parent.postMessage({type:'TESLA_STATE', payload: window.TESLA_STATE}, '*'); }catch(e){}
  }
}

/* ============================================================
   CÁMARA (rígida al coche)
   ============================================================ */
let camRoll = 0;
let viewMode = 'chase';
const camPos = new THREE.Vector3(0, 7, -12);
const camLook = new THREE.Vector3();

function updateCamera(dt){
  if(viewMode === 'chase'){
    const speedFactor = clamp(drive.speed / 40, 0, 1);
    const dist  = lerp(10, 14, speedFactor);
    const height= lerp(5.5, 7.0, speedFactor);
    camPos.set(0, height, -dist);
    camLook.set(0, 1.2, 8);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
    camRoll = lerp(camRoll, 0, 1-Math.exp(-4*dt));
    camera.rotateZ(camRoll);
  } else {
    camPos.set(0, 1.55, 0.2);
    camLook.set(0, 1.35, 12);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
  }
}

/* ============================================================
   LLUVIA
   ============================================================ */
const rainCanvas = $('rain');
const rctx = rainCanvas.getContext('2d');
let rainDrops = [];
let raining = false;

function resizeRain(){
  rainCanvas.width  = innerWidth;
  rainCanvas.height = innerHeight;
  const N = Math.round((innerWidth*innerHeight)/14000);
  rainDrops = new Array(N).fill(0).map(()=>({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    len: 6 + Math.random()*14,
    spd: 6 + Math.random()*10,
    op:  0.10 + Math.random()*0.35
  }));
}
resizeRain();

function drawRain(dt){
  rctx.clearRect(0,0,rainCanvas.width,rainCanvas.height);
  if(!raining) return;
  rctx.lineWidth = 1.2;
  rctx.strokeStyle = 'rgba(180,205,235,0.55)';
  for(const d of rainDrops){
    rctx.globalAlpha = d.op;
    rctx.beginPath();
    rctx.moveTo(d.x, d.y);
    rctx.lineTo(d.x - 1.5, d.y + d.len);
    rctx.stroke();
    d.y += d.spd * 60 * dt;
    d.x -= 1.5 * 60 * dt;
    if(d.y > rainCanvas.height + 20){ d.y = -20; d.x = Math.random()*innerWidth; }
    if(d.x < -20){ d.x = innerWidth + 20; }
  }
  rctx.globalAlpha = 1;
}

function applyWeatherToRoad(){
  if(raining){
    roadMat.roughness = 0.35;
    roadMat.metalness = 0.15;
  } else {
    roadMat.roughness = 0.85;
    roadMat.metalness = 0.08;
  }
}

const arcProg = $('arcProg');
const arcTrack = $('arcTrack');
const arcLen = arcTrack.getTotalLength();
arcProg.style.strokeDasharray = arcLen;
arcProg.style.strokeDashoffset = arcLen;

function setArcProgress(v01){
  const off = arcLen * (1 - clamp(v01,0,1));
  arcProg.style.strokeDashoffset = off;
  let c;
  if(v01 < 0.5) c = '#39d98a';
  else if(v01 < 0.8) c = '#f5b942';
  else c = '#ef5350';
  arcProg.style.stroke = c;
}

const curvFill = $('curvFill');
function setCurvBar(curv){
  const v = clamp(curv, -100, 100);
  const pct = Math.abs(v);
  if(v >= 0){
    curvFill.style.left = '50%';
    curvFill.style.width = (pct/2) + '%';
  } else {
    curvFill.style.left = (50 - pct/2) + '%';
    curvFill.style.width = (pct/2) + '%';
  }
}

function updateHUD(){
  const spd = window.TESLA_STATE.speed;
  $('spdNum').textContent = Math.round(spd);
  setArcProgress(spd / 220);
  setCurvBar(window.TESLA_STATE.curvature);
  $('infoCurv').textContent = Math.round(window.TESLA_STATE.curvature);
  $('infoHdg').textContent  = Math.round(window.TESLA_STATE.heading) + '°';
  $('infoDist').textContent = Math.round(window.TESLA_STATE.distance);
  $('infoView').textContent = viewMode === 'chase' ? 'Perseguidor' : 'Conductor';

  $('chipBrake').classList.toggle('on', drive.braking);
  const chipRain = $('chipRain');
  chipRain.textContent = raining ? '🌧️ LLUVIA' : '🌧️ SECO';
  chipRain.classList.toggle('on', raining);
  const chipDay = $('chipDay');
  chipDay.textContent = dayNightT > 0.5 ? '☀️ DÍA' : '🌙 NOCHE';
  chipDay.classList.toggle('on', dayNightT > 0.5);
  const chipGps = $('chipGps');
  if(gpsActive) chipGps.textContent = '🛰️ GPS OK';
  else if(gpsEnabled) chipGps.textContent = '🛰️ GPS…';
  else chipGps.textContent = '🛰️ GPS OFF';
  chipGps.classList.toggle('on', gpsActive);
  chipGps.classList.toggle('warn', gpsEnabled && !gpsActive);
}

const spdS = $('spdS');
const steerS = $('steerS');
const spdV = $('spdV');
const steerV = $('steerV');

function updateLabels(){
  const sv = parseFloat(steerS.value);
  if(Math.abs(sv) < 5)  steerV.textContent = 'centro';
  else if(sv < 0)       steerV.textContent = 'izquierda ' + Math.abs(Math.round(sv)) + '%';
  else                  steerV.textContent = 'derecha ' + Math.round(sv) + '%';
  spdV.textContent = Math.round(parseFloat(spdS.value)) + ' km/h';
}

  $('bDemo').classList.remove('on'); $('bAuto').classList.remove('on');

  updateLabels();
});
steerS.addEventListener('input', ()=>{
  demoOn = false; autoCurves = false;
  $('bDemo').classList.remove('on'); $('bAuto').classList.remove('on');
  drive.steer = parseFloat(steerS.value)/100;
  updateLabels();
});

$('bL').onclick = ()=>{ demoOn=false; autoCurves=false; $('bDemo').classList.remove('on'); $('bAuto').classList.remove('on'); steerS.value=-70; drive.steer=-0.7; updateLabels(); };
$('bS').onclick = ()=>{ demoOn=false; autoCurves=false; $('bDemo').classList.remove('on'); $('bAuto').classList.remove('on'); steerS.value=0;   drive.steer=0;    updateLabels(); };
$('bR').onclick = ()=>{ demoOn=false; autoCurves=false; $('bDemo').classList.remove('on'); $('bAuto').classList.remove('on'); steerS.value=70;  drive.steer=0.7;  updateLabels(); };

$('bBrake').onclick = ()=>{ drive.braking = !drive.braking; $('bBrake').classList.toggle('on', drive.braking); };
$('bRain').onclick  = ()=>{ raining = !raining; $('bRain').classList.toggle('on', raining); applyWeatherToRoad(); };
$('bDay').onclick   = ()=>{ isDay=true;  $('bDay').classList.add('on');  $('bNight').classList.remove('on'); };
$('bNight').onclick = ()=>{ isDay=false; $('bNight').classList.add('on'); $('bDay').classList.remove('on'); };
$('bCam').onclick   = ()=>{ viewMode = viewMode==='chase'?'cockpit':'chase'; window.TESLA_STATE.view = viewMode; };

$('bDemo').onclick = ()=>{
  demoOn = !demoOn;
  if(demoOn) autoCurves = false;
  $('bDemo').classList.toggle('on', demoOn);
  $('bAuto').classList.toggle('on', autoCurves);
  if(demoOn) demoTimer = 0;
};

$('bAuto').onclick = ()=>{
  autoCurves = !autoCurves;
  if(autoCurves) demoOn = false;
  $('bAuto').classList.toggle('on', autoCurves);
  $('bDemo').classList.toggle('on', demoOn);

};

$('bGps').onclick = ()=>{
  if(!gpsEnabled){
    gpsEnabled = true;
    $('bGps').classList.add('on');
    if(!navigator.geolocation){
      console.warn('Geolocalización no soportada');
      gpsEnabled = false;
      $('bGps').classList.remove('on');
      return;
    }
    gpsWatchId = navigator.geolocation.watchPosition(
      (pos)=>{
        gpsActive = true;
        window.TESLA_STATE.lat = pos.coords.latitude;
        window.TESLA_STATE.lon = pos.coords.longitude;
        window.TESLA_STATE.alt = pos.coords.altitude;
        window.TESLA_STATE.accuracy = pos.coords.accuracy;
      },
      (err)=>{
        console.warn('GPS denegado:', err.message);
        gpsActive = false; gpsEnabled = false;
        $('bGps').classList.remove('on');
      },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
    );
  } else {
    gpsEnabled = false; gpsActive = false;
    $('bGps').classList.remove('on');
    if(gpsWatchId !== null){
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
  }
};

});

addEventListener('keydown', (e)=>{
  if(e.key === 'h' || e.key === 'H') $('panel').classList.toggle('hidden');
  if(e.key === 'c' || e.key === 'C'){
    viewMode = viewMode==='chase'?'cockpit':'chase';
    window.TESLA_STATE.view = viewMode;
  }
  if(e.key === 'ArrowLeft' || e.key==='a' || e.key==='A'){
    demoOn=false; autoCurves=false; $('bDemo').classList.remove('on'); $('bAuto').classList.remove('on');
    steerS.value = Math.max(-100, parseFloat(steerS.value)-8);
    drive.steer = parseFloat(steerS.value)/100;
    updateLabels();
  }
  if(e.key === 'ArrowRight' || e.key==='d' || e.key==='D'){
    demoOn=false; autoCurves=false; $('bDemo').classList.remove('on'); $('bAuto').classList.remove('on');
    steerS.value = Math.min(100, parseFloat(steerS.value)+8);
    drive.steer = parseFloat(steerS.value)/100;
    updateLabels();
  }
  if(e.key === 'ArrowUp' || e.key==='w' || e.key==='W'){
    spdS.value = Math.min(220, parseFloat(spdS.value)+5);
    drive.targetSpeed = parseFloat(spdS.value)/3.6;
    updateLabels();
  }
  if(e.key === 'ArrowDown' || e.key==='s' || e.key==='S'){
    spdS.value = Math.max(0, parseFloat(spdS.value)-5);
    drive.targetSpeed = parseFloat(spdS.value)/3.6;
    updateLabels();
  }
  if(e.key === ' '){ drive.braking = !drive.braking; $('bBrake').classList.toggle('on', drive.braking); }
});

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  resizeRain();
}
addEventListener('resize', resize);

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
let fpsAcc = 0, fpsN = 0, fpsT = 0;

function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;

  const target = isDay ? 1 : 0;
  if(dayNightT !== target){
    dayNightT = lerp(dayNightT, target, 1-Math.exp(-2*dt));
    if(Math.abs(dayNightT-target)<0.005) dayNightT = target;
    applyDayNight();
  }

  updateDrive(dt);
  updateCamera(dt);
  drawRain(dt);
  updateHUD();

  fpsAcc += dt; fpsN++; fpsT += dt;
  if(fpsT > 0.5){
    $('infoFps').textContent = Math.round(fpsN/fpsAcc);
    fpsAcc = 0; fpsN = 0; fpsT = 0;
  }

  renderer.render(scene, camera);
}

/* ============================================================
   INIT
   ============================================================ */
generateInitialRoad();
rebuildRoadMesh();
applyDayNight();
applyWeatherToRoad();
updateLabels();
resize();
tick();

window.TeslaNav = {
  getState(){ return window.TESLA_STATE; },
  setSpeed(kmh){ spdS.value = kmh; drive.targetSpeed = kmh/3.6; updateLabels(); },
  setSteer(v){ steerS.value = clamp(v,-1,1)*100; drive.steer = clamp(v,-1,1); updateLabels(); },
  setRain(b){ raining = !!b; $('bRain').classList.toggle('on', raining); applyWeatherToRoad(); },
  setDay(b){ isDay = !!b; $('bDay').classList.toggle('on', isDay); $('bNight').classList.toggle('on', !isDay); },
  setView(v){ viewMode = v==='cockpit'?'cockpit':'chase'; window.TESLA_STATE.view = viewMode; }
};

})();
</script>
</body>
</html>
